<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certified Gen AI Specialist – Practice Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1.5rem;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(66, 133, 244, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(103, 58, 183, 0.06) 0%, transparent 50%);
        }

        /* ---- CONTAINER ---- */
        .container {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 3rem;
            padding: 2.5rem 2.8rem;
            box-shadow: 0 25px 60px -12px rgba(0, 20, 50, 0.25),
                0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
        }

        /* ---- HEADER ---- */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .quiz-title-group h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0b1e3a 0%, #1a3a6b 60%, #2d5aa0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .quiz-title-group .sub {
            font-size: 0.85rem;
            font-weight: 500;
            color: #4a6a8f;
            letter-spacing: 0.02em;
            margin-top: 0.15rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .quiz-title-group .sub .badge {
            background: #dbeafe;
            color: #1a4b8c;
            padding: 0.15rem 0.8rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .score-display {
            background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
            padding: 0.6rem 1.4rem;
            border-radius: 100px;
            box-shadow: 0 4px 12px rgba(0, 30, 60, 0.06);
            border: 1px solid rgba(66, 133, 244, 0.12);
            text-align: right;
            min-width: 130px;
        }

        .score-display .score-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #6a7f9b;
            font-weight: 600;
        }

        .score-display .score-number {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0b1e3a;
            line-height: 1.2;
        }

        .score-display .score-number span {
            font-size: 1rem;
            font-weight: 400;
            color: #6a7f9b;
        }

        /* ---- PROGRESS ---- */
        .progress-section {
            margin-bottom: 2.2rem;
        }

        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: #e6edf6;
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border-radius: 100px;
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #3a5a7a;
        }

        .progress-stats .q-counter {
            background: #eef4fa;
            padding: 0.15rem 1rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1a3a6b;
        }

        /* ---- CATEGORY TAG ---- */
        .category-tag {
            display: inline-block;
            background: #e8edf8;
            color: #1a3a6b;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.25rem 1rem;
            border-radius: 100px;
            margin-bottom: 1rem;
            border: 1px solid rgba(66, 133, 244, 0.10);
        }

        /* ---- QUESTION ---- */
        .question-card {
            background: #ffffff;
            border-radius: 1.8rem;
            padding: 2rem 2.2rem;
            box-shadow: 0 8px 28px -8px rgba(0, 20, 50, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-bottom: 1.8rem;
            transition: all 0.25s ease;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0b1e3a;
            line-height: 1.5;
            margin-bottom: 1.8rem;
            letter-spacing: -0.01em;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.4rem;
            background: #f8fafd;
            border-radius: 1rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.18s ease;
            font-size: 0.98rem;
            font-weight: 500;
            color: #1a2e4a;
        }

        .option-item:hover:not(.disabled) {
            background: #edf3fa;
            border-color: #bfd7f0;
            transform: translateX(4px);
        }

        .option-item .letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: #e6edf6;
            font-weight: 700;
            font-size: 0.8rem;
            color: #1a3a6b;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .option-item.selected {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .option-item.selected .letter {
            background: #2563eb;
            color: #fff;
        }

        .option-item.correct {
            border-color: #16a34a;
            background: #ecfdf5;
        }

        .option-item.correct .letter {
            background: #16a34a;
            color: #fff;
        }

        .option-item.incorrect {
            border-color: #dc2626;
            background: #fef2f2;
        }

        .option-item.incorrect .letter {
            background: #dc2626;
            color: #fff;
        }

        .option-item.disabled {
            cursor: default;
            opacity: 0.85;
        }

        .option-item.disabled:hover {
            transform: none;
            border-color: transparent;
        }

        .option-item.disabled.selected:hover {
            border-color: #2563eb;
        }

        .option-item.disabled.correct:hover {
            border-color: #16a34a;
        }

        .option-item.disabled.incorrect:hover {
            border-color: #dc2626;
        }

        /* ---- EXPLANATION ---- */
        .explanation-box {
            margin-top: 1.2rem;
            padding: 1rem 1.4rem;
            background: #f0f7ff;
            border-radius: 1rem;
            border-left: 4px solid #2563eb;
            font-size: 0.9rem;
            color: #1a3a5a;
            line-height: 1.6;
            display: none;
        }

        .explanation-box.show {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        .explanation-box strong {
            color: #0b1e3a;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---- NAVIGATION ---- */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .nav-btn {
            padding: 0.7rem 2rem;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            background: #e8edf8;
            color: #1a3a6b;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .nav-btn:hover:not(:disabled) {
            background: #d5e0f0;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px -6px rgba(0, 30, 60, 0.12);
        }

        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .nav-btn.primary {
            background: linear-gradient(135deg, #1a3a6b, #2563eb);
            color: #fff;
            box-shadow: 0 6px 18px -6px rgba(37, 99, 235, 0.35);
        }

        .nav-btn.primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #0f2a4a, #1a4fcf);
            box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.45);
            transform: translateY(-2px);
        }

        .nav-btn .icon {
            font-size: 1.1rem;
            line-height: 1;
        }

        /* ---- RESULTS ---- */
        .results-container {
            display: none;
            text-align: center;
            padding: 2rem 0 0.5rem;
        }

        .results-container.show {
            display: block;
            animation: fadeSlide 0.5s ease;
        }

        .results-score {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0b1e3a, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .results-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a3a6b;
            margin-top: 0.2rem;
        }

        .results-detail {
            margin-top: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.8rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .results-detail .stat-box {
            background: #f8fafd;
            padding: 0.8rem;
            border-radius: 1rem;
            border: 1px solid #e6edf6;
        }

        .results-detail .stat-box .num {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0b1e3a;
        }

        .results-detail .stat-box .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6a7f9b;
            font-weight: 600;
        }

        .reset-btn {
            margin-top: 2rem;
            padding: 0.9rem 3rem;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #1a3a6b, #2563eb);
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.35);
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px -10px rgba(37, 99, 235, 0.45);
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 700px) {
            body {
                padding: 1rem 0.8rem;
            }

            .container {
                padding: 1.5rem 1.2rem;
                border-radius: 2rem;
            }

            .quiz-title-group h1 {
                font-size: 1.4rem;
            }

            .score-display {
                padding: 0.4rem 1rem;
                min-width: 100px;
            }

            .score-display .score-number {
                font-size: 1.2rem;
            }

            .question-card {
                padding: 1.2rem 1.2rem;
                border-radius: 1.4rem;
            }

            .question-text {
                font-size: 1.05rem;
            }

            .option-item {
                padding: 0.7rem 1rem;
                font-size: 0.9rem;
                gap: 0.7rem;
            }

            .option-item .letter {
                width: 1.7rem;
                height: 1.7rem;
                font-size: 0.7rem;
            }

            .nav-btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.8rem;
            }

            .results-score {
                font-size: 3rem;
            }

            .container {
                backdrop-filter: blur(2px);
            }
        }

        @media (max-width: 450px) {
            .quiz-header {
                flex-direction: column;
                align-items: stretch;
            }

            .score-display {
                text-align: left;
                width: 100%;
            }

            .nav-controls {
                flex-direction: column;
                align-items: stretch;
            }

            .nav-btn {
                justify-content: center;
            }
        }

        /* ---- SCROLLBAR ---- */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #e6edf6;
            border-radius: 100px;
        }

        ::-webkit-scrollbar-thumb {
            background: #b0c8e0;
            border-radius: 100px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #8aacd0;
        }
    </style>
</head>
<body>

    <div class="container" id="appContainer">
        <!-- HEADER -->
        <div class="quiz-header">
            <div class="quiz-title-group">
                <h1>🧠 Gen AI Specialist</h1>
                <div class="sub">
                    <span>Certification prep · 150+ questions</span>
                    <span class="badge">Beta</span>
                </div>
            </div>
            <div class="score-display">
                <div class="score-label">Your Score</div>
                <div class="score-number" id="scoreDisplay">0 <span>/ <span id="totalQuestionsDisplay">0</span></span></div>
            </div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-section">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-stats">
                <span class="q-counter" id="questionCounter">1 / 0</span>
                <span id="accuracyDisplay">—</span>
            </div>
        </div>

        <!-- QUESTION CARD -->
        <div id="questionArea">
            <div class="category-tag" id="categoryTag">Loading…</div>
            <div class="question-card">
                <div class="question-text" id="questionText">Preparing your questions…</div>
                <div class="options-grid" id="optionsGrid"></div>
                <button class="submit-btn" id="submitBtn" disabled>✓ Submit Answer</button>
                <div class="explanation-box" id="explanationBox"></div>
                <button class="next-inline-btn" id="nextInlineBtn">Next →</button>
            </div>
        </div>

        <!-- NAVIGATION -->
        <div class="nav-controls" id="navControls">
            <button class="nav-btn" id="prevBtn" disabled>
                <span class="icon">←</span> Previous
            </button>
            <button class="nav-btn primary" id="nextBtn">
                Next <span class="icon">→</span>
            </button>
        </div>

        <!-- RESULTS -->
        <div class="results-container" id="resultsContainer">
            <div class="results-score" id="finalScore">0%</div>
            <div class="results-label" id="finalLabel">Great effort!</div>
            <div class="results-detail">
                <div class="stat-box">
                    <div class="num" id="statCorrect">0</div>
                    <div class="label">Correct</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="statIncorrect">0</div>
                    <div class="label">Incorrect</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="statSkipped">0</div>
                    <div class="label">Skipped</div>
                </div>
            </div>
            <button class="reset-btn" id="resetBtn">🔄 Restart Quiz</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  150+ QUESTIONS — based on DEEP_LEARNING.pdf + INTRODUCTION_TO_GENAI.pdf
        // ============================================================
        const QUESTIONS = [
            // ---- CATEGORY: Fundamentals of AI & Deep Learning (1–25) ----
            {
                id: 1,
                category: 'AI Fundamentals',
                question: 'What is Artificial Intelligence (AI)?',
                options: [
                    'The simulation of human intelligence processes by machines',
                    'A programming language for building websites',
                    'A type of computer hardware',
                    'A database management system'
                ],
                correct: 0,
                explanation: 'AI is defined as the simulation of human intelligence processes by machines, especially computer systems.'
            }, {
                id: 2,
                category: 'AI Fundamentals',
                question: 'Deep Learning uses layered ________ to process data.',
                options: [
                    'decision trees',
                    'neural networks',
                    'support vector machines',
                    'linear regressions'
                ],
                correct: 1,
                explanation: 'Deep Learning uses layered neural networks to process data and learn complex patterns.'
            }, {
                id: 3,
                category: 'AI Fundamentals',
                question: 'Which of the following is a core mission of AI?',
                options: [
                    'Simulating human intelligence',
                    'Replacing all human workers',
                    'Creating perfect copies of human brains',
                    'Eliminating the need for data'
                ],
                correct: 0,
                explanation: 'The core mission of AI is to simulate human intelligence, including problem solving, learning, and decision-making.'
            }, {
                id: 4,
                category: 'AI Fundamentals',
                question: 'Machine Learning allows computers to learn from data without being explicitly ________.',
                options: [
                    'programmed',
                    'trained',
                    'tested',
                    'validated'
                ],
                correct: 0,
                explanation: 'ML allows computers to learn from data without being explicitly programmed, finding patterns on their own.'
            }, {
                id: 5,
                category: 'AI Fundamentals',
                question: 'What is the primary difference between "classic" ML and Deep Learning?',
                options: [
                    'Classic ML requires more data',
                    'Classic ML depends on human intervention to identify features',
                    'Deep Learning is older than classic ML',
                    'There is no difference'
                ],
                correct: 1,
                explanation: 'Classic ML depends on human experts to determine the hierarchy of features, while deep learning learns features automatically.'
            }, {
                id: 6,
                category: 'AI Fundamentals',
                question: 'Which of the following is NOT a component of AI\'s basic mission?',
                options: [
                    'Simulating human intelligence',
                    'Problem solving and decision making',
                    'Learning and adaptation',
                    'Eliminating all human errors'
                ],
                correct: 3,
                explanation: 'AI\'s mission includes simulating intelligence, problem solving, learning, and interaction with the environment—not eliminating all human errors.'
            }, {
                id: 7,
                category: 'AI Fundamentals',
                question: 'Deep Learning gained significant traction around which time period?',
                options: [
                    '1950s',
                    '1980s',
                    '2000–2010',
                    '2020s'
                ],
                correct: 2,
                explanation: 'Deep Learning gained traction in the 2000–2010 period, driven by advanced hardware (GPUs) and improved algorithms.'
            }, {
                id: 8,
                category: 'AI Fundamentals',
                question: 'Which term describes the ability of machines to imitate intelligent human behavior?',
                options: [
                    'Automation',
                    'Artificial Intelligence',
                    'Robotics',
                    'Data Science'
                ],
                correct: 1,
                explanation: 'Artificial Intelligence is the capability of machines to imitate intelligent human behavior.'
            }, {
                id: 9,
                category: 'AI Fundamentals',
                question: 'What is a key enabler for Deep Learning\'s success in the 2010s?',
                options: [
                    'Better programming languages',
                    'Advanced hardware (GPUs)',
                    'More internet users',
                    'Cheaper electricity'
                ],
                correct: 1,
                explanation: 'Advanced hardware, particularly GPUs, along with improved algorithms, enabled the deep learning boom in the 2010s.'
            }, {
                id: 10,
                category: 'AI Fundamentals',
                question: 'ML stands for ________.',
                options: [
                    'Machine Logic',
                    'Machine Learning',
                    'Mainframe Learning',
                    'Model Learning'
                ],
                correct: 1,
                explanation: 'ML is the standard abbreviation for Machine Learning.'
            }, {
                id: 11,
                category: 'AI Fundamentals',
                question: 'Which of the following best describes "classic" or "non-deep" machine learning?',
                options: [
                    'It requires no human intervention at all',
                    'Human experts determine the hierarchy of features',
                    'It uses only neural networks',
                    'It is always more accurate than deep learning'
                ],
                correct: 1,
                explanation: 'Classic ML depends on human experts to determine the hierarchy of features to understand differences between data inputs.'
            }, {
                id: 12,
                category: 'AI Fundamentals',
                question: 'What is the role of "layers" in deep learning?',
                options: [
                    'To store data in a structured format',
                    'To process data hierarchically and extract features',
                    'To connect to the internet',
                    'To visualize results'
                ],
                correct: 1,
                explanation: 'Layered neural networks process data hierarchically, with each layer extracting increasingly complex features.'
            }, {
                id: 13,
                category: 'AI Fundamentals',
                question: 'Which of the following is a core component of AI\'s interaction with the environment?',
                options: [
                    'Reading books',
                    'Perceiving and responding to surroundings',
                    'Writing code',
                    'Designing hardware'
                ],
                correct: 1,
                explanation: 'AI interacts with the environment by perceiving and responding to surroundings, a key aspect of intelligent behavior.'
            }, {
                id: 14,
                category: 'AI Fundamentals',
                question: 'The term "Deep" in Deep Learning refers to ________.',
                options: [
                    'The depth of the data',
                    'The number of layers in the neural network',
                    'The complexity of the problem',
                    'The size of the dataset'
                ],
                correct: 1,
                explanation: '"Deep" refers to the multiple layers in the neural network, allowing for hierarchical feature learning.'
            }, {
                id: 15,
                category: 'AI Fundamentals',
                question: 'Which of the following is NOT a typical application of AI mentioned in the materials?',
                options: [
                    'Healthcare',
                    'Entertainment',
                    'Astronomy',
                    'E-commerce'
                ],
                correct: 2,
                explanation: 'Healthcare, Entertainment, and E-commerce are mentioned. Astronomy is not covered in the provided content.'
            }, {
                id: 16,
                category: 'AI Fundamentals',
                question: 'What does "simulation of human intelligence" in AI typically include?',
                options: [
                    'Only logical reasoning',
                    'Learning, reasoning, and self-correction',
                    'Only pattern recognition',
                    'Physical movement'
                ],
                correct: 1,
                explanation: 'Simulation of human intelligence includes learning, reasoning, problem-solving, perception, and language understanding.'
            }, {
                id: 17,
                category: 'AI Fundamentals',
                question: 'Which hardware advancement significantly boosted deep learning in the 2010s?',
                options: [
                    'SSD drives',
                    'GPUs (Graphics Processing Units)',
                    'Quantum computers',
                    'Optical fibers'
                ],
                correct: 1,
                explanation: 'GPUs provided the parallel processing power needed to train large deep learning models effectively.'
            }, {
                id: 18,
                category: 'AI Fundamentals',
                question: 'The ability of machines to learn from data without explicit programming is the essence of ________.',
                options: [
                    'Artificial Intelligence',
                    'Machine Learning',
                    'Deep Learning',
                    'All of the above'
                ],
                correct: 1,
                explanation: 'Machine Learning is specifically defined as the ability to learn from data without being explicitly programmed.'
            }, {
                id: 19,

        // ---- QUIZ ENGINE ----
        const totalQ = QUESTIONS.length;
        let currentIndex = 0;
        let userAnswers = new Array(totalQ).fill(null); // index of selected option, or -1 if skipped
        let questionStatus = new Array(totalQ).fill('unanswered'); // 'unanswered', 'correct', 'incorrect'
        let answeredCount = 0;

        const elements = {
            questionText: document.getElementById('questionText'),
            optionsGrid: document.getElementById('optionsGrid'),
            categoryTag: document.getElementById('categoryTag'),
            progressFill: document.getElementById('progressFill'),
            questionCounter: document.getElementById('questionCounter'),
            scoreDisplay: document.getElementById('scoreDisplay'),
            totalQuestionsDisplay: document.getElementById('totalQuestionsDisplay'),
            accuracyDisplay: document.getElementById('accuracyDisplay'),
            explanationBox: document.getElementById('explanationBox'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            resultsContainer: document.getElementById('resultsContainer'),
            questionArea: document.getElementById('questionArea'),
            navControls: document.getElementById('navControls'),
            finalScore: document.getElementById('finalScore'),
            finalLabel: document.getElementById('finalLabel'),
            statCorrect: document.getElementById('statCorrect'),
            statIncorrect: document.getElementById('statIncorrect'),
            statSkipped: document.getElementById('statSkipped'),
            resetBtn: document.getElementById('resetBtn'),
            submitBtn: document.getElementById('submitBtn'),
            nextInlineBtn: document.getElementById('nextInlineBtn'),
        };

        // Set total
        elements.totalQuestionsDisplay.textContent = totalQ;

        function renderQuestion(index) {
            const q = QUESTIONS[index];
            if (!q) return;

            // Category
            elements.categoryTag.textContent = q.category;

            // Question
            elements.questionText.textContent = `${index + 1}. ${q.question}`;

            // Options
            const letters = ['A', 'B', 'C', 'D'];
            let html = '';
            q.options.forEach((opt, i) => {
                let cls = 'option-item';
                const selected = userAnswers[index] === i;
                const isAnswered = userAnswers[index] !== null && userAnswers[index] !== undefined;
                const isCorrect = q.correct === i;

                if (isAnswered) {
                    cls += ' disabled';
                    if (selected) {
                        cls += isCorrect ? ' correct' : ' incorrect';
                    } else if (isCorrect) {
                        // Show correct answer even if not selected
                        cls += ' correct';
                    }
                } else {
                    if (selected) cls += ' selected';
                }

                html += `
                    <div class="${cls}" data-optindex="${i}" data-qindex="${index}">
                        <span class="letter">${letters[i]}</span>
                        <span>${opt}</span>
                    </div>
                `;
            });
            elements.optionsGrid.innerHTML = html;

            // Explanation
            const isAnswered2 = userAnswers[index] !== null && userAnswers[index] !== undefined;
            if (isAnswered2) {
                const isCorrect2 = userAnswers[index] === q.correct;
                elements.explanationBox.innerHTML = `
                    <strong>${isCorrect2 ? '✅ Correct' : '❌ Incorrect'}</strong><br>
                    ${q.explanation}
                `;
                elements.explanationBox.classList.add('show');
                elements.submitBtn.classList.remove('show');
                const isLast3 = index === totalQ - 1;
                if (isLast3) {
                    elements.nextInlineBtn.textContent = '📊 See Results';
                } else {
                    elements.nextInlineBtn.textContent = 'Next →';
                }
                elements.nextInlineBtn.classList.add('show');
            } else {
                elements.explanationBox.classList.remove('show');
                elements.nextInlineBtn.classList.remove('show');
                const tempSelected = document.querySelector('.option-item.selected');
                if (tempSelected) {
                    elements.submitBtn.disabled = false;
                } else {
                    elements.submitBtn.disabled = true;
                }
                elements.submitBtn.classList.add('show');
            }

            // Option click handlers (only if not answered)
            document.querySelectorAll('.option-item:not(.disabled)').forEach(el => {
                el.addEventListener('click', function() {
                    const qi = parseInt(this.dataset.qindex);
                    const optIdx = parseInt(this.dataset.optindex);
                    if (userAnswers[qi] !== null && userAnswers[qi] !== undefined) return;
                    selectOption(qi, optIdx);
                });
            });

            // Update progress
            updateProgress();

            // Nav buttons
            elements.prevBtn.disabled = index === 0;
            const isLast = index === totalQ - 1;
            const isAnswered3 = userAnswers[index] !== null && userAnswers[index] !== undefined;
            elements.nextBtn.textContent = isLast ? '📊 See Results' : 'Next →';
            elements.nextBtn.disabled = !isAnswered3;
            // If all answered, also enable
            if (answeredCount === totalQ) {
                elements.nextBtn.disabled = false;
            }

            // Update score
            updateScore();
        }

        function selectOption(qIndex, optIndex) {
            if (userAnswers[qIndex] !== null && userAnswers[qIndex] !== undefined) return;
            // Visually select the option — do NOT record answer yet
            document.querySelectorAll('.option-item').forEach(el => {
                el.classList.remove('selected');
            });
            const clicked = document.querySelector(`.option-item[data-qindex="${qIndex}"][data-optindex="${optIndex}"]`);
            if (clicked) clicked.classList.add('selected');
            // Enable submit button
            elements.submitBtn.disabled = false;
        }

        function submitAnswer() {
            const q = QUESTIONS[currentIndex];
            if (!q) return;
            if (userAnswers[currentIndex] !== null && userAnswers[currentIndex] !== undefined) return;
            // Find selected option
            const selectedEl = document.querySelector('.option-item.selected');
            if (!selectedEl) return;
            const optIndex = parseInt(selectedEl.dataset.optindex);
            userAnswers[currentIndex] = optIndex;
            const isCorrect = optIndex === q.correct;
            questionStatus[currentIndex] = isCorrect ? 'correct' : 'incorrect';
            answeredCount = userAnswers.filter(a => a !== null && a !== undefined).length;
            renderQuestion(currentIndex);
            updateScore();
        }

        function handleNextInline() {
            if (currentIndex === totalQ - 1) {
                const allAnswered = userAnswers.every(a => a !== null && a !== undefined);
                if (allAnswered) {
                    showResults();
                } else {
                    const answered = userAnswers.filter(a => a !== null && a !== undefined).length;
                    if (answered === totalQ) {
                        showResults();
                    } else {
                        alert(`You've answered ${answered} of ${totalQ} questions. Please answer all questions to see results.`);
                    }
                }
                return;
            }
            if (currentIndex < totalQ - 1) {
                goToQuestion(currentIndex + 1);
            }
        }

        function goToQuestion(index) {
            if (index < 0 || index >= totalQ) return;
            currentIndex = index;
            renderQuestion(index);
            // Scroll to top of card
            document.querySelector('.question-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function updateProgress() {
            const answered = userAnswers.filter(a => a !== null && a !== undefined).length;
            const pct = totalQ > 0 ? (answered / totalQ) * 100 : 0;
            elements.progressFill.style.width = `${pct}%`;
            elements.questionCounter.textContent = `${currentIndex + 1} / ${totalQ}`;
            // accuracy
            const correctCount = questionStatus.filter(s => s === 'correct').length;
            const attempted = questionStatus.filter(s => s === 'correct' || s === 'incorrect').length;
            const acc = attempted > 0 ? Math.round((correctCount / attempted) * 100) : 0;
            elements.accuracyDisplay.textContent = attempted > 0 ? `🎯 ${acc}%` : '—';
        }

        function updateScore() {
            const correctCount = questionStatus.filter(s => s === 'correct').length;
            const attempted = questionStatus.filter(s => s === 'correct' || s === 'incorrect').length;
            elements.scoreDisplay.innerHTML = `${correctCount} <span>/ ${totalQ}</span>`;
        }

        function showResults() {
            // Hide question area, show results
            elements.questionArea.style.display = 'none';
            elements.navControls.style.display = 'none';
            elements.resultsContainer.classList.add('show');

            const correctCount = questionStatus.filter(s => s === 'correct').length;
            const incorrectCount = questionStatus.filter(s => s === 'incorrect').length;
            const skippedCount = totalQ - correctCount - incorrectCount;
            const pct = totalQ > 0 ? Math.round((correctCount / totalQ) * 100) : 0;

            elements.finalScore.textContent = `${pct}%`;
            let label = 'Keep practicing! 💪';
            if (pct >= 90) label = '🌟 Excellent! You\'re ready for the exam!';
            else if (pct >= 70) label = '👏 Good job! Review a few more topics.';
            else if (pct >= 50) label = '📚 Keep studying — you\'re on the right track!';
            elements.finalLabel.textContent = label;

            elements.statCorrect.textContent = correctCount;
            elements.statIncorrect.textContent = incorrectCount;
            elements.statSkipped.textContent = skippedCount;

            // Update progress bar to 100%
            elements.progressFill.style.width = '100%';
            elements.questionCounter.textContent = `${totalQ} / ${totalQ}`;
            elements.accuracyDisplay.textContent = `🎯 ${pct}%`;
        }

        // ---- EVENT LISTENERS ----
        elements.prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) goToQuestion(currentIndex - 1);
        });

        elements.nextBtn.addEventListener('click', () => {
            if (currentIndex === totalQ - 1) {
                // Check if all answered
                const allAnswered = userAnswers.every(a => a !== null && a !== undefined);
                if (allAnswered) {
                    showResults();
                } else {
                    // If not all answered, but last is answered, show results anyway
                    const answered = userAnswers.filter(a => a !== null && a !== undefined).length;
                    if (answered === totalQ) {
                        showResults();
                    } else {
                        alert(`You've answered ${answered} of ${totalQ} questions. Please answer all questions to see results, or review your answers.`);
                    }
                }
                return;
            }
            if (currentIndex < totalQ - 1) {
                goToQuestion(currentIndex + 1);
            }
        });

        elements.submitBtn.addEventListener('click', submitAnswer);

        elements.nextInlineBtn.addEventListener('click', handleNextInline);

        elements.resetBtn.addEventListener('click', () => {
            // Reset all
            userAnswers = new Array(totalQ).fill(null);
            questionStatus = new Array(totalQ).fill('unanswered');
            answeredCount = 0;
            currentIndex = 0;
            elements.resultsContainer.classList.remove('show');
            elements.questionArea.style.display = 'block';
            elements.navControls.style.display = 'flex';
            renderQuestion(0);
            updateProgress();
            updateScore();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && !elements.prevBtn.disabled) {
                elements.prevBtn.click();
            } else if (e.key === 'ArrowRight' && !elements.nextBtn.disabled) {
                elements.nextBtn.click();
            } else if (e.key === 'Enter') {
                const isAnswered = userAnswers[currentIndex] !== null && userAnswers[currentIndex] !== undefined;
                if (!isAnswered && !elements.submitBtn.disabled && elements.submitBtn.classList.contains('show')) {
                    elements.submitBtn.click();
                } else if (isAnswered && elements.nextInlineBtn.classList.contains('show')) {
                    elements.nextInlineBtn.click();
                }
            } else if (e.key === '1') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 0) opts[0].click();
            } else if (e.key === '2') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 1) opts[1].click();
            } else if (e.key === '3') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 2) opts[2].click();
            } else if (e.key === '4') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 3) opts[3].click();
            }
        });

        // ---- INIT ----
        renderQuestion(0);
        updateProgress();
        updateScore();
    </script>
</body>
</html>
