<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certified Gen AI Specialist – Advanced Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1.5rem;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(66, 133, 244, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(103, 58, 183, 0.06) 0%, transparent 50%);
        }
        .container {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 3rem;
            padding: 2.5rem 2.8rem;
            box-shadow: 0 25px 60px -12px rgba(0, 20, 50, 0.25),
                0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        .quiz-title-group h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0b1e3a 0%, #1a3a6b 60%, #2d5aa0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .quiz-title-group .sub {
            font-size: 0.85rem;
            font-weight: 500;
            color: #4a6a8f;
            letter-spacing: 0.02em;
            margin-top: 0.15rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .quiz-title-group .sub .badge {
            background: #dbeafe;
            color: #1a4b8c;
            padding: 0.15rem 0.8rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .score-display {
            background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
            padding: 0.6rem 1.4rem;
            border-radius: 100px;
            box-shadow: 0 4px 12px rgba(0, 30, 60, 0.06);
            border: 1px solid rgba(66, 133, 244, 0.12);
            text-align: right;
            min-width: 130px;
        }
        .score-display .score-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #6a7f9b;
            font-weight: 600;
        }
        .score-display .score-number {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0b1e3a;
            line-height: 1.2;
        }
        .score-display .score-number span {
            font-size: 1rem;
            font-weight: 400;
            color: #6a7f9b;
        }
        .progress-section {
            margin-bottom: 2.2rem;
        }
        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: #e6edf6;
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border-radius: 100px;
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #3a5a7a;
        }
        .progress-stats .q-counter {
            background: #eef4fa;
            padding: 0.15rem 1rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1a3a6b;
        }
        .category-tag {
            display: inline-block;
            background: #e8edf8;
            color: #1a3a6b;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.25rem 1rem;
            border-radius: 100px;
            margin-bottom: 1rem;
            border: 1px solid rgba(66, 133, 244, 0.10);
        }
        .question-card {
            background: #ffffff;
            border-radius: 1.8rem;
            padding: 2rem 2.2rem;
            box-shadow: 0 8px 28px -8px rgba(0, 20, 50, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-bottom: 1.8rem;
            transition: all 0.25s ease;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0b1e3a;
            line-height: 1.5;
            margin-bottom: 1.8rem;
            letter-spacing: -0.01em;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.4rem;
            background: #f8fafd;
            border-radius: 1rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.18s ease;
            font-size: 0.98rem;
            font-weight: 500;
            color: #1a2e4a;
        }
        .option-item:hover:not(.disabled) {
            background: #edf3fa;
            border-color: #bfd7f0;
            transform: translateX(4px);
        }
        .option-item .letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: #e6edf6;
            font-weight: 700;
            font-size: 0.8rem;
            color: #1a3a6b;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .option-item.selected {
            border-color: #2563eb;
            background: #eff6ff;
        }
        .option-item.selected .letter {
            background: #2563eb;
            color: #fff;
        }
        .option-item.correct {
            border-color: #16a34a;
            background: #ecfdf5;
        }
        .option-item.correct .letter {
            background: #16a34a;
            color: #fff;
        }
        .option-item.incorrect {
            border-color: #dc2626;
            background: #fef2f2;
        }
        .option-item.incorrect .letter {
            background: #dc2626;
            color: #fff;
        }
        .option-item.disabled {
            cursor: default;
            opacity: 0.85;
        }
        .option-item.disabled:hover {
            transform: none;
            border-color: transparent;
        }
        .option-item.disabled.selected:hover {
            border-color: #2563eb;
        }
        .option-item.disabled.correct:hover {
            border-color: #16a34a;
        }
        .option-item.disabled.incorrect:hover {
            border-color: #dc2626;
        }
        .explanation-box {
            margin-top: 1.2rem;
            padding: 1rem 1.4rem;
            background: #f0f7ff;
            border-radius: 1rem;
            border-left: 4px solid #2563eb;
            font-size: 0.9rem;
            color: #1a3a5a;
            line-height: 1.6;
            display: none;
        }
        .explanation-box.show {
            display: block;
            animation: fadeSlide 0.3s ease;
        }
        .explanation-box strong {
            color: #0b1e3a;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .nav-btn {
            padding: 0.7rem 2rem;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            background: #e8edf8;
            color: #1a3a6b;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .nav-btn:hover:not(:disabled) {
            background: #d5e0f0;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px -6px rgba(0, 30, 60, 0.12);
        }
        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        .nav-btn.primary {
            background: linear-gradient(135deg, #1a3a6b, #2563eb);
            color: #fff;
            box-shadow: 0 6px 18px -6px rgba(37, 99, 235, 0.35);
        }
        .nav-btn.primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #0f2a4a, #1a4fcf);
            box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.45);
            transform: translateY(-2px);
        }
        .nav-btn .icon {
            font-size: 1.1rem;
            line-height: 1;
        }
        .results-container {
            display: none;
            text-align: center;
            padding: 2rem 0 0.5rem;
        }
        .results-container.show {
            display: block;
            animation: fadeSlide 0.5s ease;
        }
        .results-score {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0b1e3a, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }
        .results-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a3a6b;
            margin-top: 0.2rem;
        }
        .results-detail {
            margin-top: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.8rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .results-detail .stat-box {
            background: #f8fafd;
            padding: 0.8rem;
            border-radius: 1rem;
            border: 1px solid #e6edf6;
        }
        .results-detail .stat-box .num {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0b1e3a;
        }
        .results-detail .stat-box .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6a7f9b;
            font-weight: 600;
        }
        .reset-btn {
            margin-top: 2rem;
            padding: 0.9rem 3rem;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #1a3a6b, #2563eb);
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.35);
        }
        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px -10px rgba(37, 99, 235, 0.45);
        }
        @media (max-width: 700px) {
            body { padding: 1rem 0.8rem; }
            .container { padding: 1.5rem 1.2rem; border-radius: 2rem; }
            .quiz-title-group h1 { font-size: 1.4rem; }
            .score-display { padding: 0.4rem 1rem; min-width: 100px; }
            .score-display .score-number { font-size: 1.2rem; }
            .question-card { padding: 1.2rem 1.2rem; border-radius: 1.4rem; }
            .question-text { font-size: 1.05rem; }
            .option-item { padding: 0.7rem 1rem; font-size: 0.9rem; gap: 0.7rem; }
            .option-item .letter { width: 1.7rem; height: 1.7rem; font-size: 0.7rem; }
            .nav-btn { padding: 0.5rem 1.2rem; font-size: 0.8rem; }
            .results-score { font-size: 3rem; }
            .container { backdrop-filter: blur(2px); }
        }
        @media (max-width: 450px) {
            .quiz-header { flex-direction: column; align-items: stretch; }
            .score-display { text-align: left; width: 100%; }
            .nav-controls { flex-direction: column; align-items: stretch; }
            .nav-btn { justify-content: center; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #e6edf6; border-radius: 100px; }
        ::-webkit-scrollbar-thumb { background: #b0c8e0; border-radius: 100px; }
        ::-webkit-scrollbar-thumb:hover { background: #8aacd0; }
        .submit-btn {
            margin-top: 1rem;
            padding: 0.65rem 1.8rem;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            background: linear-gradient(135deg, #1a3a6b, #2563eb);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 18px -6px rgba(37, 99, 235, 0.35);
            display: none;
        }
        .submit-btn.show { display: inline-block; }
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.45);
        }
        .submit-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
        .next-inline-btn {
            margin-top: 1rem;
            padding: 0.6rem 1.8rem;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.88rem;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px -4px rgba(22, 163, 74, 0.35);
            display: none;
        }
        .next-inline-btn.show { display: inline-block; }
        .next-inline-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px -6px rgba(22, 163, 74, 0.45);
        }
    </style>
</head>
<body>

    <div class="container" id="appContainer">
        <!-- HEADER -->
        <div class="quiz-header">
            <div class="quiz-title-group">
                <h1>🧠 Gen AI Specialist</h1>
                <div class="sub">
                    <span>Advanced Topics · 150+ questions</span>
                    <span class="badge">Beta</span>
                </div>
            </div>
            <div class="score-display">
                <div class="score-label">Your Score</div>
                <div class="score-number" id="scoreDisplay">0 <span>/ <span id="totalQuestionsDisplay">0</span></span></div>
            </div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-section">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-stats">
                <span class="q-counter" id="questionCounter">1 / 0</span>
                <span id="accuracyDisplay">—</span>
            </div>
        </div>

        <!-- QUESTION CARD -->
        <div id="questionArea">
            <div class="category-tag" id="categoryTag">Loading…</div>
            <div class="question-card">
                <div class="question-text" id="questionText">Preparing your questions…</div>
                <div class="options-grid" id="optionsGrid"></div>
                <button class="submit-btn" id="submitBtn" disabled>✓ Submit Answer</button>
                <div class="explanation-box" id="explanationBox"></div>
                <button class="next-inline-btn" id="nextInlineBtn">Next →</button>
            </div>
        </div>

        <!-- NAVIGATION -->
        <div class="nav-controls" id="navControls">
            <button class="nav-btn" id="prevBtn" disabled>
                <span class="icon">←</span> Previous
            </button>
            <button class="nav-btn primary" id="nextBtn">
                Next <span class="icon">→</span>
            </button>
        </div>

        <!-- RESULTS -->
        <div class="results-container" id="resultsContainer">
            <div class="results-score" id="finalScore">0%</div>
            <div class="results-label" id="finalLabel">Great effort!</div>
            <div class="results-detail">
                <div class="stat-box">
                    <div class="num" id="statCorrect">0</div>
                    <div class="label">Correct</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="statIncorrect">0</div>
                    <div class="label">Incorrect</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="statSkipped">0</div>
                    <div class="label">Skipped</div>
                </div>
            </div>
            <button class="reset-btn" id="resetBtn">🔄 Restart Quiz</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  150+ QUESTIONS — based on newly uploaded documents
        //  Topics: Overfitting/Underfitting, Gradient Descent variants,
        //  Learning in NN (forward/backprop, loss functions), Regularization
        // ============================================================
        const QUESTIONS = [
            // ---- OVERFITTING & UNDERFITTING (1–30) ----
            {
                id: 1,
                category: 'Overfitting & Underfitting',
                question: 'What is overfitting in neural networks?',
                options: [
                    'Model learns training data too well, performing poorly on new data',
                    'Model is too simple to capture patterns',
                    'Model has too few parameters',
                    'Model trains too quickly'
                ],
                correct: 0,
                explanation: 'Overfitting occurs when the model memorizes training data and fails to generalize to new, unseen data.'
            }, {
                id: 2,
                category: 'Overfitting & Underfitting',
                question: 'What is underfitting in neural networks?',
                options: [
                    'Model is too simple to grasp complex patterns, leading to subpar performance',
                    'Model memorizes training data',
                    'Model has too many parameters',
                    'Model overfits the validation set'
                ],
                correct: 0,
                explanation: 'Underfitting happens when the model is too simplistic and cannot capture the underlying patterns in the data.'
            }, {
                id: 3,
                category: 'Overfitting & Underfitting',
                question: 'What is the "Goldilocks Zone" in modeling?',
                options: [
                    'The ideal balance where model is neither too simple nor too complex, generalizing well',
                    'The zone where model overfits',
                    'The zone where model underfits',
                    'The zone with maximum training accuracy'
                ],
                correct: 0,
                explanation: 'The Goldilocks Zone is the optimal model complexity that balances bias and variance, leading to good generalization.'
            }, {
                id: 4,
                category: 'Overfitting & Underfitting',
                question: 'Which of the following can cause overfitting?',
                options: [
                    'Too complex model architecture',
                    'Too few training samples',
                    'Presence of noisy data and outliers',
                    'All of the above'
                ],
                correct: 3,
                explanation: 'Overfitting can be caused by high model complexity, insufficient data, and noisy data that the model memorizes.'
            }, {
                id: 5,
                category: 'Overfitting & Underfitting',
                question: 'Which of the following can cause underfitting?',
                options: [
                    'Model architecture too simple',
                    'Too much training data',
                    'High regularization',
                    'Both A and C'
                ],
                correct: 3,
                explanation: 'Underfitting can be caused by a too-simple model or excessive regularization that restricts the model from learning patterns.'
            }, {
                id: 6,
                category: 'Overfitting & Underfitting',
                question: 'What is the purpose of a train-test split?',
                options: [
                    'To evaluate model generalization on unseen data',
                    'To increase training data size',
                    'To reduce overfitting by using more data',
                    'To simplify the model'
                ],
                correct: 0,
                explanation: 'The test set is used to evaluate how well the model generalizes to new data, providing an unbiased performance measure.'
            }, {
                id: 7,
                category: 'Overfitting & Underfitting',
                question: 'What is the role of a validation set in a 3-way split?',
                options: [
                    'To tune hyperparameters and guide model selection without touching the test set',
                    'To evaluate final model performance',
                    'To augment the training data',
                    'To replace the test set'
                ],
                correct: 0,
                explanation: 'The validation set is used for hyperparameter tuning and model selection, while the test set is kept untouched for final evaluation.'
            }, {
                id: 8,
                category: 'Overfitting & Underfitting',
                question: 'What is K-fold cross-validation?',
                options: [
                    'A technique that extends train-test split by partitioning data into k folds and rotating training/validation',
                    'A method to augment data',
                    'A regularization technique',
                    'A type of gradient descent'
                ],
                correct: 0,
                explanation: 'K-fold cross-validation splits data into k folds, each used once as validation while the rest are used for training, providing a robust performance estimate.'
            }, {
                id: 9,
                category: 'Overfitting & Underfitting',
                question: 'What is early stopping?',
                options: [
                    'Halting training when validation performance stops improving to prevent overfitting',
                    'Stopping training after a fixed number of epochs',
                    'Stopping training when training accuracy reaches 100%',
                    'Stopping training when the loss is zero'
                ],
                correct: 0,
                explanation: 'Early stopping monitors validation performance and stops training when it starts to degrade, preventing overfitting.'
            }, {
                id: 10,
                category: 'Overfitting & Underfitting',
                question: 'What is pruning in neural networks?',
                options: [
                    'Reducing model complexity by removing neurons or layers to prevent overfitting',
                    'Adding more layers to increase capacity',
                    'Increasing training data size',
                    'Adjusting the learning rate'
                ],
                correct: 0,
                explanation: 'Pruning removes unnecessary neurons or layers to simplify the model and reduce overfitting.'
            }, {
                id: 11,
                category: 'Overfitting & Underfitting',
                question: 'What is data augmentation?',
                options: [
                    'Creating new training samples through transformations like rotation, flipping, and zooming',
                    'Reducing the dataset size',
                    'Changing the model architecture',
                    'Increasing the learning rate'
                ],
                correct: 0,
                explanation: 'Data augmentation generates new training examples from existing ones using transformations, increasing data variety and robustness.'
            }, {
                id: 12,
                category: 'Overfitting & Underfitting',
                question: 'Which of the following is a sign of overfitting?',
                options: [
                    'High training accuracy, low validation accuracy',
                    'Low training accuracy, high validation accuracy',
                    'Both training and validation accuracy are low',
                    'Both training and validation accuracy are high'
                ],
                correct: 0,
                explanation: 'Overfitting is indicated by a large gap between training accuracy (high) and validation accuracy (low).'
            }, {
                id: 13,
                category: 'Overfitting & Underfitting',
                question: 'Which of the following is a sign of underfitting?',
                options: [
                    'Low training accuracy and low validation accuracy',
                    'High training accuracy and low validation accuracy',
                    'Low training accuracy and high validation accuracy',
                    'High training accuracy and high validation accuracy'
                ],
                correct: 0,
                explanation: 'Underfitting is indicated by low performance on both training and validation sets, meaning the model is too simple.'
            }, {
                id: 14,
                category: 'Overfitting & Underfitting',
                question: 'What is the main goal of addressing overfitting and underfitting?',
                options: [
                    'To find a model that generalizes well to new data while capturing core patterns',
                    'To maximize training accuracy',
                    'To minimize validation accuracy',
                    'To use the largest model possible'
                ],
                correct: 0,
                explanation: 'The goal is to achieve good generalization, balancing the trade-off between bias and variance.'
            }, {
                id: 15,
                category: 'Overfitting & Underfitting',
                question: 'Which factor can influence overfitting?',
                options: [
                    'Volume and diversity of training data',
                    'Model architecture complexity',
                    'Training duration',
                    'All of the above'
                ],
                correct: 3,
                explanation: 'Overfitting is influenced by data size/diversity, model complexity, and training duration (early stopping strategies).'

        // ---- QUIZ ENGINE ----
        const totalQ = QUESTIONS.length;
        let currentIndex = 0;
        let userAnswers = new Array(totalQ).fill(null);
        let questionStatus = new Array(totalQ).fill('unanswered');
        let answeredCount = 0;

        const elements = {
            questionText: document.getElementById('questionText'),
            optionsGrid: document.getElementById('optionsGrid'),
            categoryTag: document.getElementById('categoryTag'),
            progressFill: document.getElementById('progressFill'),
            questionCounter: document.getElementById('questionCounter'),
            scoreDisplay: document.getElementById('scoreDisplay'),
            totalQuestionsDisplay: document.getElementById('totalQuestionsDisplay'),
            accuracyDisplay: document.getElementById('accuracyDisplay'),
            explanationBox: document.getElementById('explanationBox'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            resultsContainer: document.getElementById('resultsContainer'),
            questionArea: document.getElementById('questionArea'),
            navControls: document.getElementById('navControls'),
            finalScore: document.getElementById('finalScore'),
            finalLabel: document.getElementById('finalLabel'),
            statCorrect: document.getElementById('statCorrect'),
            statIncorrect: document.getElementById('statIncorrect'),
            statSkipped: document.getElementById('statSkipped'),
            resetBtn: document.getElementById('resetBtn'),
            submitBtn: document.getElementById('submitBtn'),
            nextInlineBtn: document.getElementById('nextInlineBtn'),
        };

        elements.totalQuestionsDisplay.textContent = totalQ;

        function renderQuestion(index) {
            const q = QUESTIONS[index];
            if (!q) return;
            elements.categoryTag.textContent = q.category;
            elements.questionText.textContent = `${index + 1}. ${q.question}`;
            const letters = ['A', 'B', 'C', 'D'];
            let html = '';
            q.options.forEach((opt, i) => {
                let cls = 'option-item';
                const selected = userAnswers[index] === i;
                const isAnswered = userAnswers[index] !== null && userAnswers[index] !== undefined;
                const isCorrect = q.correct === i;
                if (isAnswered) {
                    cls += ' disabled';
                    if (selected) {
                        cls += isCorrect ? ' correct' : ' incorrect';
                    } else if (isCorrect) {
                        cls += ' correct';
                    }
                } else {
                    if (selected) cls += ' selected';
                }
                html += `
                    <div class="${cls}" data-optindex="${i}" data-qindex="${index}">
                        <span class="letter">${letters[i]}</span>
                        <span>${opt}</span>
                    </div>
                `;
            });
            elements.optionsGrid.innerHTML = html;

            const isAnswered2 = userAnswers[index] !== null && userAnswers[index] !== undefined;
            if (isAnswered2) {
                const isCorrect2 = userAnswers[index] === q.correct;
                elements.explanationBox.innerHTML = `
                    <strong>${isCorrect2 ? '✅ Correct' : '❌ Incorrect'}</strong><br>
                    ${q.explanation}
                `;
                elements.explanationBox.classList.add('show');
                elements.submitBtn.classList.remove('show');
                const isLast3 = index === totalQ - 1;
                if (isLast3) {
                    elements.nextInlineBtn.textContent = '📊 See Results';
                } else {
                    elements.nextInlineBtn.textContent = 'Next →';
                }
                elements.nextInlineBtn.classList.add('show');
            } else {
                elements.explanationBox.classList.remove('show');
                elements.nextInlineBtn.classList.remove('show');
                const tempSelected = document.querySelector('.option-item.selected');
                if (tempSelected) {
                    elements.submitBtn.disabled = false;
                } else {
                    elements.submitBtn.disabled = true;
                }
                elements.submitBtn.classList.add('show');
            }

            document.querySelectorAll('.option-item:not(.disabled)').forEach(el => {
                el.addEventListener('click', function() {
                    const qi = parseInt(this.dataset.qindex);
                    const optIdx = parseInt(this.dataset.optindex);
                    if (userAnswers[qi] !== null && userAnswers[qi] !== undefined) return;
                    selectOption(qi, optIdx);
                });
            });

            updateProgress();
            elements.prevBtn.disabled = index === 0;
            const isLast = index === totalQ - 1;
            const isAnswered3 = userAnswers[index] !== null && userAnswers[index] !== undefined;
            elements.nextBtn.textContent = isLast ? '📊 See Results' : 'Next →';
            elements.nextBtn.disabled = !isAnswered3;
            if (answeredCount === totalQ) {
                elements.nextBtn.disabled = false;
            }
            updateScore();
        }

        function selectOption(qIndex, optIndex) {
            if (userAnswers[qIndex] !== null && userAnswers[qIndex] !== undefined) return;
            document.querySelectorAll('.option-item').forEach(el => {
                el.classList.remove('selected');
            });
            const clicked = document.querySelector(.option-item[data-qindex=""][data-optindex=""]);
            if (clicked) clicked.classList.add('selected');
            elements.submitBtn.disabled = false;
        }

        function submitAnswer() {
            const q = QUESTIONS[currentIndex];
            if (!q) return;
            if (userAnswers[currentIndex] !== null && userAnswers[currentIndex] !== undefined) return;
            const selectedEl = document.querySelector('.option-item.selected');
            if (!selectedEl) return;
            const optIndex = parseInt(selectedEl.dataset.optindex);
            userAnswers[currentIndex] = optIndex;
            const isCorrect = optIndex === q.correct;
            questionStatus[currentIndex] = isCorrect ? 'correct' : 'incorrect';
            answeredCount = userAnswers.filter(a => a !== null && a !== undefined).length;
            renderQuestion(currentIndex);
            updateScore();
        }

        function handleNextInline() {
            if (currentIndex === totalQ - 1) {
                const allAnswered = userAnswers.every(a => a !== null && a !== undefined);
                if (allAnswered) {
                    showResults();
                } else {
                    const answered = userAnswers.filter(a => a !== null && a !== undefined).length;
                    if (answered === totalQ) {
                        showResults();
                    } else {
                        alert(You've answered  of  questions. Please answer all questions to see results.);
                    }
                }
                return;
            }
            if (currentIndex < totalQ - 1) {
                goToQuestion(currentIndex + 1);
            }
        }
        function goToQuestion(index) {
            if (index < 0 || index >= totalQ) return;
            currentIndex = index;
            renderQuestion(index);
            document.querySelector('.question-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function updateProgress() {
            const answered = userAnswers.filter(a => a !== null && a !== undefined).length;
            const pct = totalQ > 0 ? (answered / totalQ) * 100 : 0;
            elements.progressFill.style.width = `${pct}%`;
            elements.questionCounter.textContent = `${currentIndex + 1} / ${totalQ}`;
            const correctCount = questionStatus.filter(s => s === 'correct').length;
            const attempted = questionStatus.filter(s => s === 'correct' || s === 'incorrect').length;
            const acc = attempted > 0 ? Math.round((correctCount / attempted) * 100) : 0;
            elements.accuracyDisplay.textContent = attempted > 0 ? `🎯 ${acc}%` : '—';
        }

        function updateScore() {
            const correctCount = questionStatus.filter(s => s === 'correct').length;
            elements.scoreDisplay.innerHTML = `${correctCount} <span>/ ${totalQ}</span>`;
        }

        function showResults() {
            elements.questionArea.style.display = 'none';
            elements.navControls.style.display = 'none';
            elements.resultsContainer.classList.add('show');
            const correctCount = questionStatus.filter(s => s === 'correct').length;
            const incorrectCount = questionStatus.filter(s => s === 'incorrect').length;
            const skippedCount = totalQ - correctCount - incorrectCount;
            const pct = totalQ > 0 ? Math.round((correctCount / totalQ) * 100) : 0;
            elements.finalScore.textContent = `${pct}%`;
            let label = 'Keep practicing! 💪';
            if (pct >= 90) label = '🌟 Excellent! You\'re ready for the exam!';
            else if (pct >= 70) label = '👏 Good job! Review a few more topics.';
            else if (pct >= 50) label = '📚 Keep studying — you\'re on the right track!';
            elements.finalLabel.textContent = label;
            elements.statCorrect.textContent = correctCount;
            elements.statIncorrect.textContent = incorrectCount;
            elements.statSkipped.textContent = skippedCount;
            elements.progressFill.style.width = '100%';
            elements.questionCounter.textContent = `${totalQ} / ${totalQ}`;
            elements.accuracyDisplay.textContent = `🎯 ${pct}%`;
        }

        elements.prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) goToQuestion(currentIndex - 1);
        });

        elements.nextBtn.addEventListener('click', () => {
            if (currentIndex === totalQ - 1) {
                const allAnswered = userAnswers.every(a => a !== null && a !== undefined);
                if (allAnswered) {
                    showResults();
                } else {
                    const answered = userAnswers.filter(a => a !== null && a !== undefined).length;
                    if (answered === totalQ) {
                        showResults();
                    } else {
                        alert(`You've answered ${answered} of ${totalQ} questions. Please answer all questions to see results.`);
                    }
                }
                return;
            }
            if (currentIndex < totalQ - 1) {
                goToQuestion(currentIndex + 1);
            }
        });

        elements.submitBtn.addEventListener('click', submitAnswer);

        elements.nextInlineBtn.addEventListener('click', handleNextInline);

        elements.resetBtn.addEventListener('click', () => {
            userAnswers = new Array(totalQ).fill(null);
            questionStatus = new Array(totalQ).fill('unanswered');
            answeredCount = 0;
            currentIndex = 0;
            elements.resultsContainer.classList.remove('show');
            elements.questionArea.style.display = 'block';
            elements.navControls.style.display = 'flex';
            renderQuestion(0);
            updateProgress();
            updateScore();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && !elements.prevBtn.disabled) {
                elements.prevBtn.click();
            } else if (e.key === 'ArrowRight' && !elements.nextBtn.disabled) {
                elements.nextBtn.click();
            } else if (e.key === 'Enter') {
                const isAnswered = userAnswers[currentIndex] !== null && userAnswers[currentIndex] !== undefined;
                if (!isAnswered && !elements.submitBtn.disabled && elements.submitBtn.classList.contains('show')) {
                    elements.submitBtn.click();
                } else if (isAnswered && elements.nextInlineBtn.classList.contains('show')) {
                    elements.nextInlineBtn.click();
                }
            } else if (e.key === '1') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 0) opts[0].click();
            } else if (e.key === '2') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 1) opts[1].click();
            } else if (e.key === '3') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 2) opts[2].click();
            } else if (e.key === '4') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 3) opts[3].click();
            }
        });

        renderQuestion(0);
        updateProgress();
        updateScore();
    </script>
</body>
