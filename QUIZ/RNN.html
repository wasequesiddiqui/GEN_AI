<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RNN & Transformers – Practice Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1.5rem;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(66, 133, 244, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(103, 58, 183, 0.06) 0%, transparent 50%);
        }
        .container {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 3rem;
            padding: 2.5rem 2.8rem;
            box-shadow: 0 25px 60px -12px rgba(0, 20, 50, 0.25),
                0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            gap: 1rem;
        }
        .quiz-title-group h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0b1e3a 0%, #1a3a6b 60%, #2d5aa0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .quiz-title-group .sub {
            font-size: 0.85rem;
            font-weight: 500;
            color: #4a6a8f;
            letter-spacing: 0.02em;
            margin-top: 0.15rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .quiz-title-group .sub .badge {
            background: #dbeafe;
            color: #1a4b8c;
            padding: 0.15rem 0.8rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .score-display {
            background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
            padding: 0.6rem 1.4rem;
            border-radius: 100px;
            box-shadow: 0 4px 12px rgba(0, 30, 60, 0.06);
            border: 1px solid rgba(66, 133, 244, 0.12);
            text-align: right;
            min-width: 130px;
        }
        .score-display .score-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #6a7f9b;
            font-weight: 600;
        }
        .score-display .score-number {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0b1e3a;
            line-height: 1.2;
        }
        .score-display .score-number span {
            font-size: 1rem;
            font-weight: 400;
            color: #6a7f9b;
        }
        .progress-section {
            margin-bottom: 2.2rem;
        }
        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: #e6edf6;
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border-radius: 100px;
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #3a5a7a;
        }
        .progress-stats .q-counter {
            background: #eef4fa;
            padding: 0.15rem 1rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1a3a6b;
        }
        .category-tag {
            display: inline-block;
            background: #e8edf8;
            color: #1a3a6b;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.25rem 1rem;
            border-radius: 100px;
            margin-bottom: 1rem;
            border: 1px solid rgba(66, 133, 244, 0.10);
        }
        .question-card {
            background: #ffffff;
            border-radius: 1.8rem;
            padding: 2rem 2.2rem;
            box-shadow: 0 8px 28px -8px rgba(0, 20, 50, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-bottom: 1.8rem;
            transition: all 0.25s ease;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0b1e3a;
            line-height: 1.5;
            margin-bottom: 1.8rem;
            letter-spacing: -0.01em;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.4rem;
            background: #f8fafd;
            border-radius: 1rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.18s ease;
            font-size: 0.98rem;
            font-weight: 500;
            color: #1a2e4a;
        }
        .option-item:hover:not(.disabled) {
            background: #edf3fa;
            border-color: #bfd7f0;
            transform: translateX(4px);
        }
        .option-item .letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: #e6edf6;
            font-weight: 700;
            font-size: 0.8rem;
            color: #1a3a6b;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .option-item.selected {
            border-color: #2563eb;
            background: #eff6ff;
        }
        .option-item.selected .letter {
            background: #2563eb;
            color: #fff;
        }
        .option-item.correct {
            border-color: #16a34a;
            background: #ecfdf5;
        }
        .option-item.correct .letter {
            background: #16a34a;
            color: #fff;
        }
        .option-item.incorrect {
            border-color: #dc2626;
            background: #fef2f2;
        }
        .option-item.incorrect .letter {
            background: #dc2626;
            color: #fff;
        }
        .option-item.disabled {
            cursor: default;
            opacity: 0.85;
        }
        .option-item.disabled:hover {
            transform: none;
            border-color: transparent;
        }
        .option-item.disabled.selected:hover {
            border-color: #2563eb;
        }
        .option-item.disabled.correct:hover {
            border-color: #16a34a;
        }
        .option-item.disabled.incorrect:hover {
            border-color: #dc2626;
        }
        .explanation-box {
            margin-top: 1.2rem;
            padding: 1rem 1.4rem;
            background: #f0f7ff;
            border-radius: 1rem;
            border-left: 4px solid #2563eb;
            font-size: 0.9rem;
            color: #1a3a5a;
            line-height: 1.6;
            display: none;
        }
        .explanation-box.show {
            display: block;
            animation: fadeSlide 0.3s ease;
        }
        .explanation-box strong {
            color: #0b1e3a;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .nav-btn {
            padding: 0.7rem 2rem;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            background: #e8edf8;
            color: #1a3a6b;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .nav-btn:hover:not(:disabled) {
            background: #d5e0f0;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px -6px rgba(0, 30, 60, 0.12);
        }
        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        .nav-btn.primary {
            background: linear-gradient(135deg, #1a3a6b, #2563eb);
            color: #fff;
            box-shadow: 0 6px 18px -6px rgba(37, 99, 235, 0.35);
        }
        .nav-btn.primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #0f2a4a, #1a4fcf);
            box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.45);
            transform: translateY(-2px);
        }
        .nav-btn .icon {
            font-size: 1.1rem;
            line-height: 1;
        }
        .results-container {
            display: none;
            text-align: center;
            padding: 2rem 0 0.5rem;
        }
        .results-container.show {
            display: block;
            animation: fadeSlide 0.5s ease;
        }
        .results-score {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0b1e3a, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }
        .results-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a3a6b;
            margin-top: 0.2rem;
        }
        .results-detail {
            margin-top: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.8rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .results-detail .stat-box {
            background: #f8fafd;
            padding: 0.8rem;
            border-radius: 1rem;
            border: 1px solid #e6edf6;
        }
        .results-detail .stat-box .num {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0b1e3a;
        }
        .results-detail .stat-box .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6a7f9b;
            font-weight: 600;
        }
        .reset-btn {
            margin-top: 2rem;
            padding: 0.9rem 3rem;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #1a3a6b, #2563eb);
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.35);
        }
        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px -10px rgba(37, 99, 235, 0.45);
        }
        @media (max-width: 700px) {
            body { padding: 1rem 0.8rem; }
            .container { padding: 1.5rem 1.2rem; border-radius: 2rem; }
            .quiz-title-group h1 { font-size: 1.4rem; }
            .score-display { padding: 0.4rem 1rem; min-width: 100px; }
            .score-display .score-number { font-size: 1.2rem; }
            .question-card { padding: 1.2rem 1.2rem; border-radius: 1.4rem; }
            .question-text { font-size: 1.05rem; }
            .option-item { padding: 0.7rem 1rem; font-size: 0.9rem; gap: 0.7rem; }
            .option-item .letter { width: 1.7rem; height: 1.7rem; font-size: 0.7rem; }
            .nav-btn { padding: 0.5rem 1.2rem; font-size: 0.8rem; }
            .results-score { font-size: 3rem; }
            .container { backdrop-filter: blur(2px); }
        }
        @media (max-width: 450px) {
            .quiz-header { flex-direction: column; align-items: stretch; }
            .score-display { text-align: left; width: 100%; }
            .nav-controls { flex-direction: column; align-items: stretch; }
            .nav-btn { justify-content: center; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #e6edf6; border-radius: 100px; }
        ::-webkit-scrollbar-thumb { background: #b0c8e0; border-radius: 100px; }
        ::-webkit-scrollbar-thumb:hover { background: #8aacd0; }
        .submit-btn {
            margin-top: 1rem;
            padding: 0.65rem 1.8rem;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            background: linear-gradient(135deg, #1a3a6b, #2563eb);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 18px -6px rgba(37, 99, 235, 0.35);
            display: none;
        }
        .submit-btn.show { display: inline-block; }
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.45);
        }
        .submit-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
        .next-inline-btn {
            margin-top: 1rem;
            padding: 0.6rem 1.8rem;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.88rem;
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px -4px rgba(22, 163, 74, 0.35);
            display: none;
        }
        .next-inline-btn.show { display: inline-block; }
        .next-inline-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px -6px rgba(22, 163, 74, 0.45);
        }
    </style>
</head>
<body>

    <div class="container" id="appContainer">
        <!-- HEADER -->
        <div class="quiz-header">
            <div class="quiz-title-group">
                <h1>🧠 Gen AI Specialist</h1>
                <div class="sub">
                    <span>RNN & Transformers · 150+ questions</span>
                    <span class="badge">Beta</span>
                </div>
            </div>
            <div class="score-display">
                <div class="score-label">Your Score</div>
                <div class="score-number" id="scoreDisplay">0 <span>/ <span id="totalQuestionsDisplay">0</span></span></div>
            </div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-section">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-stats">
                <span class="q-counter" id="questionCounter">1 / 0</span>
                <span id="accuracyDisplay">—</span>
            </div>
        </div>

        <!-- QUESTION CARD -->
        <div id="questionArea">
            <div class="category-tag" id="categoryTag">Loading…</div>
            <div class="question-card">
                <div class="question-text" id="questionText">Preparing your questions…</div>
                <div class="options-grid" id="optionsGrid"></div>
                <button class="submit-btn" id="submitBtn" disabled>✓ Submit Answer</button>
                <div class="explanation-box" id="explanationBox"></div>
                <button class="next-inline-btn" id="nextInlineBtn">Next →</button>
            </div>
        </div>

        <!-- NAVIGATION -->
        <div class="nav-controls" id="navControls">
            <button class="nav-btn" id="prevBtn" disabled>
                <span class="icon">←</span> Previous
            </button>
            <button class="nav-btn primary" id="nextBtn">
                Next <span class="icon">→</span>
            </button>
        </div>

        <!-- RESULTS -->
        <div class="results-container" id="resultsContainer">
            <div class="results-score" id="finalScore">0%</div>
            <div class="results-label" id="finalLabel">Great effort!</div>
            <div class="results-detail">
                <div class="stat-box">
                    <div class="num" id="statCorrect">0</div>
                    <div class="label">Correct</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="statIncorrect">0</div>
                    <div class="label">Incorrect</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="statSkipped">0</div>
                    <div class="label">Skipped</div>
                </div>
            </div>
            <button class="reset-btn" id="resetBtn">🔄 Restart Quiz</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  150+ QUESTIONS — based on RNN and Transformer documents
        //  Topics: RNNs, LSTMs, GRUs, Bidirectional RNNs, Transformers,
        //  Attention, Self-Attention, Positional Encoding, BERT, GPT,
        //  Sentiment Analysis, Weather Forecasting, Music Generation,
        //  Stock Market Prediction
        // ============================================================
        const QUESTIONS = [
            // ---- RNN BASICS (1–25) ----
            {
                id: 1,
                category: 'RNN Basics',
                question: 'What are Recurrent Neural Networks (RNNs) primarily designed for?',
                options: [
                    'Sequential data with temporal dependencies',
                    'Image data only',
                    'Tabular data',
                    'Unstructured text only'
                ],
                correct: 0,
                explanation: 'RNNs are designed for sequential data and have memory cells to capture temporal information.【4†L2】'
            }, {
                id: 2,
                category: 'RNN Basics',
                question: 'Which of the following is a key feature of RNNs?',
                options: [
                    'Memory cells to capture temporal information',
                    'Convolutional filters',
                    'Feedforward connections only',
                    'No memory of past inputs'
                ],
                correct: 0,
                explanation: 'RNNs have memory cells that allow them to capture temporal information and context from previous inputs.【4†L2】'
            }, {
                id: 3,
                category: 'RNN Basics',
                question: 'RNNs are commonly used in which of the following applications?',
                options: [
                    'Natural Language Processing (NLP)',
                    'Image classification only',
                    'Object detection',
                    'Only regression tasks'
                ],
                correct: 0,
                explanation: 'RNNs are used in NLP, time series analysis, and other sequential data applications.【4†L2】'
            }, {
                id: 4,
                category: 'RNN Basics',
                question: 'What type of data is RNNs particularly well-suited for?',
                options: [
                    'Time-series data, text, video frames, and audio signals',
                    'Only images',
                    'Only tabular data',
                    'Only unstructured text'
                ],
                correct: 0,
                explanation: 'RNNs are designed for sequential data including time-series, natural language text, video frames, and audio signals.【5†L3】'
            }, {
                id: 5,
                category: 'RNN Basics',
                question: 'Why is sequential memory important in RNNs?',
                options: [
                    'To retain context and learn temporal dependencies',
                    'To increase model complexity',
                    'To reduce training time',
                    'To eliminate the need for activation functions'
                ],
                correct: 0,
                explanation: 'Sequential memory allows RNNs to retain context, capture temporal dependencies, and learn from past to predict future.【5†L4】'
            }, {
                id: 6,
                category: 'RNN Basics',
                question: 'How do RNNs process sequences?',
                options: [
                    'Using loops in their architecture that allow information persistence',
                    'Using a feedforward approach without loops',
                    'Using only convolutional layers',
                    'Using a single pass through the data'
                ],
                correct: 0,
                explanation: 'RNNs use loops in their architecture that allow information to persist and be passed from one step to the next.【5†L5】'
            }, {
                id: 7,
                category: 'RNN Basics',
                question: 'What are memory cells in RNNs?',
                options: [
                    'Building blocks that take current input and previous state to produce a new state and output',
                    'Components that store all training data',
                    'Layers that only process current input',
                    'Filters that extract features from images'
                ],
                correct: 0,
                explanation: 'Memory cells are the building blocks of RNN memory that take the current input and previous state to produce a new state and output.【5†L6】'
            }, {
                id: 8,
                category: 'RNN Basics',
                question: 'What is a major challenge when training RNNs?',
                options: [
                    'Vanishing and exploding gradients',
                    'Lack of sequential data',
                    'Too many parameters',
                    'Inability to process text'
                ],
                correct: 0,
                explanation: 'RNNs suffer from vanishing and exploding gradients, difficulty with long sequences, and computational intensity.【5†L8】'
            }, {
                id: 9,
                category: 'RNN Basics',
                question: 'What is the vanishing gradient problem in RNNs?',
                options: [
                    'Gradients become very small, making it difficult to update weights in early layers',
                    'Gradients become very large, causing unstable training',
                    'Gradients are not computed at all',
                    'Gradients oscillate wildly'
                ],
                correct: 0,
                explanation: 'The vanishing gradient problem occurs when gradients become very small, making it difficult to update weights in early layers and learn long-term dependencies.【5†L9】'
            }, {
                id: 10,
                category: 'RNN Basics',
                question: 'What is the exploding gradient problem in RNNs?',
                options: [
                    'Gradients become very large, causing drastic weight updates and training instability',
                    'Gradients become very small',
                    'Gradients are constant',
                    'Gradients are not computed'
                ],
                correct: 0,
                explanation: 'The exploding gradient problem occurs when gradients become very large, leading to drastic weight updates and training instability.【5†L8】'
            }, {
                id: 11,
                category: 'RNN Basics',
                question: 'Which architecture was developed to address the vanishing gradient problem in RNNs?',
                options: [
                    'Long Short-Term Memory (LSTM)',
                    'Convolutional Neural Network (CNN)',
                    'Feedforward Neural Network',
                    'Autoencoder'
                ],
                correct: 0,
                explanation: 'LSTMs are a specialized RNN architecture designed to overcome the vanishing gradient problem and learn long sequences.【5†L10】'
            }, {
                id: 12,
                category: 'RNN Basics',
                question: 'What is a Gated Recurrent Unit (GRU)?',
                options: [
                    'A variation of LSTMs with a simplified architecture and comparable performance',
                    'A type of CNN',
                    'A feedforward network',
                    'A type of activation function'
                ],
                correct: 0,
                explanation: 'GRUs are a variation of LSTMs with a simplified architecture and comparable performance, often with faster training.【5†L11】'
            }, {
                id: 13,
                category: 'RNN Basics',
                question: 'What is a Bidirectional RNN?',
                options: [
                    'An RNN that processes sequences from both ends to capture overlooked patterns',
                    'An RNN with two hidden layers',
                    'An RNN that only processes forward',
                    'An RNN that only processes backward'
                ],
                correct: 0,
                explanation: 'Bidirectional RNNs process sequences from both ends, capturing overlooked patterns and enhancing sequence understanding.【5†L12】'
            }, {
                id: 14,
                category: 'RNN Basics',
                question: 'Which of the following is a common use case for RNNs?',
                options: [
                    'Text generation and machine translation',
                    'Image classification',
                    'Object detection',
                    'Clustering'
                ],
                correct: 0,

                        cls += ' correct';

                } else {
                    if (selected) cls += ' selected';
                }
                html += `

                        <span class="letter">${letters[i]}</span>
                        <span>${opt}</span>
                    </div>
                `;
            });

                if (opts.length > 1) opts[1].click();
            } else if (e.key === '3') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 2) opts[2].click();
            } else if (e.key === '4') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 3) opts[3].click();
            }
        });

        renderQuestion(0);
        updateProgress();
        updateScore();
    </script>
</body>
</html>
