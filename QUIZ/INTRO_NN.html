<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certified Gen AI Specialist – Practice Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4fc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1.5rem;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(66, 133, 244, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(103, 58, 183, 0.06) 0%, transparent 50%);
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 3rem;
            padding: 2.5rem 2.8rem;
            box-shadow: 0 25px 60px -12px rgba(0, 20, 50, 0.25),
                0 2px 8px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s ease;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .quiz-title-group h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #0b1e3a 0%, #1a3a6b 60%, #2d5aa0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .quiz-title-group .sub {
            font-size: 0.85rem;
            font-weight: 500;
            color: #4a6a8f;
            letter-spacing: 0.02em;
            margin-top: 0.15rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .quiz-title-group .sub .badge {
            background: #dbeafe;
            color: #1a4b8c;
            padding: 0.15rem 0.8rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .score-display {
            background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
            padding: 0.6rem 1.4rem;
            border-radius: 100px;
            box-shadow: 0 4px 12px rgba(0, 30, 60, 0.06);
            border: 1px solid rgba(66, 133, 244, 0.12);
            text-align: right;
            min-width: 130px;
        }

        .score-display .score-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #6a7f9b;
            font-weight: 600;
        }

        .score-display .score-number {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0b1e3a;
            line-height: 1.2;
        }

        .score-display .score-number span {
            font-size: 1rem;
            font-weight: 400;
            color: #6a7f9b;
        }

        .progress-section {
            margin-bottom: 2.2rem;
        }

        .progress-bar-track {
            width: 100%;
            height: 6px;
            background: #e6edf6;
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border-radius: 100px;
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #3a5a7a;
        }

        .progress-stats .q-counter {
            background: #eef4fa;
            padding: 0.15rem 1rem;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1a3a6b;
        }

        .category-tag {
            display: inline-block;
            background: #e8edf8;
            color: #1a3a6b;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.25rem 1rem;
            border-radius: 100px;
            margin-bottom: 1rem;
            border: 1px solid rgba(66, 133, 244, 0.10);
        }

        .question-card {
            background: #ffffff;
            border-radius: 1.8rem;
            padding: 2rem 2.2rem;
            box-shadow: 0 8px 28px -8px rgba(0, 20, 50, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-bottom: 1.8rem;
            transition: all 0.25s ease;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: #0b1e3a;
            line-height: 1.5;
            margin-bottom: 1.8rem;
            letter-spacing: -0.01em;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.4rem;
            background: #f8fafd;
            border-radius: 1rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.18s ease;
            font-size: 0.98rem;
            font-weight: 500;
            color: #1a2e4a;
        }

        .option-item:hover:not(.disabled) {
            background: #edf3fa;
            border-color: #bfd7f0;
            transform: translateX(4px);
        }

        .option-item .letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: #e6edf6;
            font-weight: 700;
            font-size: 0.8rem;
            color: #1a3a6b;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .option-item.selected {
            border-color: #2563eb;
            background: #eff6ff;
        }

        .option-item.selected .letter {
            background: #2563eb;
            color: #fff;
        }

        .option-item.correct {
            border-color: #16a34a;
            background: #ecfdf5;
        }

        .option-item.correct .letter {
            background: #16a34a;
            color: #fff;
        }

        .option-item.incorrect {
            border-color: #dc2626;
            background: #fef2f2;
        }

        .option-item.incorrect .letter {
            background: #dc2626;
            color: #fff;
        }

        .option-item.disabled {
            cursor: default;
            opacity: 0.85;
        }

        .option-item.disabled:hover {
            transform: none;
            border-color: transparent;
        }

        .option-item.disabled.selected:hover {
            border-color: #2563eb;
        }

        .option-item.disabled.correct:hover {
            border-color: #16a34a;
        }

        .option-item.disabled.incorrect:hover {
            border-color: #dc2626;
        }

        .explanation-box {
            margin-top: 1.2rem;
            padding: 1rem 1.4rem;
            background: #f0f7ff;
            border-radius: 1rem;
            border-left: 4px solid #2563eb;
            font-size: 0.9rem;
            color: #1a3a5a;
            line-height: 1.6;
            display: none;
        }

        .explanation-box.show {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        .explanation-box strong {
            color: #0b1e3a;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .nav-btn {
            padding: 0.7rem 2rem;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            background: #e8edf8;
            color: #1a3a6b;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }

        .nav-btn:hover:not(:disabled) {
            background: #d5e0f0;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px -6px rgba(0, 30, 60, 0.12);
        }

        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        .nav-btn.primary {
            background: linear-gradient(135deg, #1a3a6b, #2563eb);
            color: #fff;
            box-shadow: 0 6px 18px -6px rgba(37, 99, 235, 0.35);
        }

        .nav-btn.primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #0f2a4a, #1a4fcf);
            box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.45);
            transform: translateY(-2px);
        }

        .nav-btn .icon {
            font-size: 1.1rem;
            line-height: 1;
        }

        .results-container {
            display: none;
            text-align: center;
            padding: 2rem 0 0.5rem;
        }

        .results-container.show {
            display: block;
            animation: fadeSlide 0.5s ease;
        }

        .results-score {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0b1e3a, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .results-label {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a3a6b;
            margin-top: 0.2rem;
        }

        .results-detail {
            margin-top: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.8rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .results-detail .stat-box {
            background: #f8fafd;
            padding: 0.8rem;
            border-radius: 1rem;
            border: 1px solid #e6edf6;
        }

        .results-detail .stat-box .num {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0b1e3a;
        }

        .results-detail .stat-box .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #6a7f9b;
            font-weight: 600;
        }

        .reset-btn {
            margin-top: 2rem;
            padding: 0.9rem 3rem;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1rem;
            background: linear-gradient(135deg, #1a3a6b, #2563eb);
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.35);
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px -10px rgba(37, 99, 235, 0.45);
        }

        @media (max-width: 700px) {
            body {
                padding: 1rem 0.8rem;
            }
            .container {
                padding: 1.5rem 1.2rem;
                border-radius: 2rem;
            }
            .quiz-title-group h1 {
                font-size: 1.4rem;
            }
            .score-display {
                padding: 0.4rem 1rem;
                min-width: 100px;
            }
            .score-display .score-number {
                font-size: 1.2rem;
            }
            .question-card {
                padding: 1.2rem 1.2rem;
                border-radius: 1.4rem;
            }
            .question-text {
                font-size: 1.05rem;
            }
            .option-item {
                padding: 0.7rem 1rem;
                font-size: 0.9rem;
                gap: 0.7rem;
            }
            .option-item .letter {
                width: 1.7rem;
                height: 1.7rem;
                font-size: 0.7rem;
            }
            .nav-btn {
                padding: 0.5rem 1.2rem;
                font-size: 0.8rem;
            }
            .results-score {
                font-size: 3rem;
            }
            .container {
                backdrop-filter: blur(2px);
            }
        }

        @media (max-width: 450px) {
            .quiz-header {
                flex-direction: column;
                align-items: stretch;
            }
            .score-display {
                text-align: left;
                width: 100%;
            }
            .nav-controls {
                flex-direction: column;
                align-items: stretch;
            }
            .nav-btn {
                justify-content: center;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e6edf6;
            border-radius: 100px;
        }
        ::-webkit-scrollbar-thumb {
            background: #b0c8e0;
            border-radius: 100px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8aacd0;
        }
    </style>
</head>
<body>

    <div class="container" id="appContainer">
        <!-- HEADER -->
        <div class="quiz-header">
            <div class="quiz-title-group">
                <h1>🧠 Gen AI Specialist</h1>
                <div class="sub">
                    <span>Certification prep · 150+ questions</span>
                    <span class="badge">Beta</span>
                </div>
            </div>
            <div class="score-display">
                <div class="score-label">Your Score</div>
                <div class="score-number" id="scoreDisplay">0 <span>/ <span id="totalQuestionsDisplay">0</span></span></div>
            </div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-section">
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progressFill"></div>
            </div>
            <div class="progress-stats">
                <span class="q-counter" id="questionCounter">1 / 0</span>
                <span id="accuracyDisplay">—</span>
            </div>
        </div>

        <!-- QUESTION CARD -->
        <div id="questionArea">
            <div class="category-tag" id="categoryTag">Loading…</div>
            <div class="question-card">
                <div class="question-text" id="questionText">Preparing your questions…</div>
                <div class="options-grid" id="optionsGrid"></div>
                <button class="submit-btn" id="submitBtn" disabled>✓ Submit Answer</button>
                <div class="explanation-box" id="explanationBox"></div>
                <button class="next-inline-btn" id="nextInlineBtn">Next →</button>
            </div>
        </div>

        <!-- NAVIGATION -->
        <div class="nav-controls" id="navControls">
            <button class="nav-btn" id="prevBtn" disabled>
                <span class="icon">←</span> Previous
            </button>
            <button class="nav-btn primary" id="nextBtn">
                Next <span class="icon">→</span>
            </button>
        </div>

        <!-- RESULTS -->
        <div class="results-container" id="resultsContainer">
            <div class="results-score" id="finalScore">0%</div>
            <div class="results-label" id="finalLabel">Great effort!</div>
            <div class="results-detail">
                <div class="stat-box">
                    <div class="num" id="statCorrect">0</div>
                    <div class="label">Correct</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="statIncorrect">0</div>
                    <div class="label">Incorrect</div>
                </div>
                <div class="stat-box">
                    <div class="num" id="statSkipped">0</div>
                    <div class="label">Skipped</div>
                </div>
            </div>
            <button class="reset-btn" id="resetBtn">🔄 Restart Quiz</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  150+ QUESTIONS — based on all uploaded documents
        // ============================================================
        const QUESTIONS = [
            // ---- ACTIVATION FUNCTIONS (1–35) ----
            {
                id: 1,
                category: 'Activation Functions',
                question: 'What is the primary purpose of an activation function in a neural network?',
                options: [
                    'To introduce non-linearity and determine the neuron\'s output',
                    'To store weights between layers',
                    'To reduce the number of parameters',
                    'To speed up training by skipping layers'
                ],
                correct: 0,
                explanation: 'Activation functions introduce non-linearity and determine the neuron\'s output, enabling the network to learn complex patterns.'
            }, {
                id: 2,
                category: 'Activation Functions',
                question: 'Which of the following is a key reason for using non-linear activation functions in deep learning?',
                options: [
                    'To capture complex patterns beyond straight lines',
                    'To make the network faster',
                    'To reduce the number of neurons',
                    'To eliminate the need for bias'
                ],
                correct: 0,
                explanation: 'Non-linearity allows neural networks to capture complex patterns that linear functions cannot represent.'
            }, {
                id: 3,
                category: 'Activation Functions',
                question: 'What is the range of the Sigmoid activation function?',
                options: [
                    '(-∞, ∞)',
                    '(0, 1)',
                    '(-1, 1)',
                    '[0, ∞)'
                ],
                correct: 1,
                explanation: 'The Sigmoid function outputs values between 0 and 1, making it suitable for binary classification.'
            }, {
                id: 4,
                category: 'Activation Functions',
                question: 'For what type of task is the Sigmoid activation function commonly used?',
                options: [
                    'Multi-class classification',
                    'Binary classification',
                    'Regression',
                    'Dimensionality reduction'
                ],
                correct: 1,
                explanation: 'Sigmoid is used in binary classification because its output can be interpreted as a probability between 0 and 1.'
            }, {
                id: 5,
                category: 'Activation Functions',
                question: 'What is the range of the Tanh activation function?',
                options: [
                    '(0, 1)',
                    '(-1, 1)',
                    '(-∞, ∞)',
                    '[0, ∞)'
                ],
                correct: 1,
                explanation: 'Tanh outputs values between -1 and 1, centering the data around zero.'
            }, {
                id: 6,
                category: 'Activation Functions',
                question: 'For an input of 2, what is the approximate output of the Tanh activation function?',
                options: [
                    '0.8808',
                    '0.964',
                    '2.0',
                    '0.1192'
                ],
                correct: 1,
                explanation: 'Tanh(2) ≈ 0.964, as shown in the document examples.'
            }, {
                id: 7,
                category: 'Activation Functions',
                question: 'What does the ReLU (Rectified Linear Unit) activation function output for a negative input?',
                options: [
                    'The input value itself',
                    'Zero',
                    'A small negative value',
                    'The absolute value'
                ],
                correct: 1,
                explanation: 'ReLU outputs zero for negative inputs and the input value for positive inputs.'
            }, {
                id: 8,
                category: 'Activation Functions',
                question: 'For an input of -2, what does ReLU output?',
                options: [
                    '-2',
                    '0',
                    '2',
                    '-0.02'
                ],
                correct: 1,
                explanation: 'ReLU outputs 0 for any negative input, including -2.'
            }, {
                id: 9,
                category: 'Activation Functions',
                question: 'What is the main advantage of Leaky ReLU over standard ReLU?',
                options: [
                    'It allows small negative values for negative inputs, avoiding dead neurons',
                    'It is faster to compute',
                    'It has a wider range',
                    'It works only for binary classification'
                ],
                correct: 0,
                explanation: 'Leaky ReLU allows a small gradient for negative inputs, which helps avoid dead neurons during training.'
            }, {
                id: 10,
                category: 'Activation Functions',
                question: 'For an input of -2, what does Leaky ReLU typically output (with alpha = 0.01)?',
                options: [
                    '0',
                    '-2',
                    '-0.02',
                    '0.02'
                ],
                correct: 2,
                explanation: 'Leaky ReLU with alpha=0.01 outputs -0.02 for an input of -2 (alpha * input).'
            }, {
                id: 11,
                category: 'Activation Functions',
                question: 'What is the key difference between PReLU and Leaky ReLU?',
                options: [
                    'PReLU introduces a learnable parameter to control the slope for negative values',
                    'PReLU is always linear',
                    'PReLU only works for positive inputs',
                    'PReLU has no activation function'
                ],
                correct: 0,
                explanation: 'PReLU (Parametric ReLU) generalizes ReLU by introducing a learnable parameter that controls the slope for negative values.'
            }, {
                id: 12,
                category: 'Activation Functions',
                question: 'What does the Softmax activation function do?',
                options: [
                    'Converts a vector of numbers into a probability distribution summing to 1',
                    'Outputs only 0 or 1',
                    'Squares the input values',
                    'Takes the absolute value of each input'
                ],
                correct: 0,
                explanation: 'Softmax converts a vector of logits into a probability distribution where all outputs sum to 1, making it ideal for multi-class classification.'
            }, {
                id: 13,
                category: 'Activation Functions',
                question: 'Which activation function is typically used in the output layer for multi-class classification?',
                options: [
                    'Sigmoid',
                    'Tanh',
                    'ReLU',
                    'Softmax'
                ],
                correct: 3,
                explanation: 'Softmax is used for multi-class classification because it produces a probability distribution over multiple classes.'
            }, {
                id: 14,
                category: 'Activation Functions',
                question: 'What is the output of Softmax across all classes?',
                options: [
                    'It sums to 0',
                    'It sums to 1',
                    'It sums to the number of classes',
                    'It sums to infinity'
                ],
                correct: 1,
                explanation: 'Softmax outputs a probability distribution where the sum of all outputs is exactly 1.'
            }, {
                id: 15,
                category: 'Activation Functions',
                question: 'Which of the following is a linear activation function?',
                options: [
                    'Sigmoid',
                    'Tanh',
                    'Linear (identity)',
                    'ReLU'
                ],
                correct: 2,
                explanation: 'The linear activation function (identity function) is linear, while Sigmoid, Tanh, and ReLU are non-linear.'
            }, {
                id: 16,
                category: 'Activation Functions',
                question: 'Why is non-linearity essential in deep learning?',
                options: [
                    'It allows the network to learn complex patterns and non-linear relationships',
                    'It makes the network faster',
                    'It reduces memory usage',
                    'It eliminates the need for bias'
                ],
                correct: 0,
                explanation: 'Non-linearity is essential because real-world problems are often non-linear; without it, deep networks would just be linear transformations.'
            }, {
                id: 17,
                category: 'Activation Functions',
                question: 'What is the "vanishing gradient" problem?',
                options: [
                    'Gradients become very small and training slows or stops',
                    'Gradients become extremely large',
                    'Gradients vanish after the first epoch',
                    'Gradients are not computed at all'
                ],
                correct: 0,
                explanation: 'The vanishing gradient problem occurs when gradients become very small, making it difficult for the network to update weights effectively.'
            }, {
                id: 18,
                category: 'Activation Functions',
                question: 'Which activation function is most effective at mitigating the vanishing gradient problem?',
                options: [
                    'Sigmoid',
                    'Tanh',
                    'ReLU',
                    'Softmax'
                ],
                correct: 2,
                explanation: 'ReLU mitigates the vanishing gradient problem because its gradient is 1 for positive inputs, allowing gradients to flow more freely.'
            }, {
                id: 19,
                category: 'Activation Functions',
                question: 'For an input of 2, what does ReLU output?',
                options: [
                    '0',

        // ---- QUIZ ENGINE ----
        const totalQ = QUESTIONS.length;
        let currentIndex = 0;
        let userAnswers = new Array(totalQ).fill(null);
        let questionStatus = new Array(totalQ).fill('unanswered');
        let answeredCount = 0;

        const elements = {
            questionText: document.getElementById('questionText'),
            optionsGrid: document.getElementById('optionsGrid'),
            categoryTag: document.getElementById('categoryTag'),
            progressFill: document.getElementById('progressFill'),
            questionCounter: document.getElementById('questionCounter'),
            scoreDisplay: document.getElementById('scoreDisplay'),
            totalQuestionsDisplay: document.getElementById('totalQuestionsDisplay'),
            accuracyDisplay: document.getElementById('accuracyDisplay'),
            explanationBox: document.getElementById('explanationBox'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            resultsContainer: document.getElementById('resultsContainer'),
            questionArea: document.getElementById('questionArea'),
            navControls: document.getElementById('navControls'),
            finalScore: document.getElementById('finalScore'),
            finalLabel: document.getElementById('finalLabel'),
            statCorrect: document.getElementById('statCorrect'),
            statIncorrect: document.getElementById('statIncorrect'),
            statSkipped: document.getElementById('statSkipped'),
            resetBtn: document.getElementById('resetBtn'),
            submitBtn: document.getElementById('submitBtn'),
            nextInlineBtn: document.getElementById('nextInlineBtn'),
        };

        elements.totalQuestionsDisplay.textContent = totalQ;

        function renderQuestion(index) {
            const q = QUESTIONS[index];
            if (!q) return;
            elements.categoryTag.textContent = q.category;
            elements.questionText.textContent = `${index + 1}. ${q.question}`;
            const letters = ['A', 'B', 'C', 'D'];
            let html = '';
            q.options.forEach((opt, i) => {
                let cls = 'option-item';
                const selected = userAnswers[index] === i;
                const isAnswered = userAnswers[index] !== null && userAnswers[index] !== undefined;
                const isCorrect = q.correct === i;
                if (isAnswered) {
                    cls += ' disabled';
                    if (selected) {
                        cls += isCorrect ? ' correct' : ' incorrect';
                    } else if (isCorrect) {
                        cls += ' correct';
                    }
                } else {
                    if (selected) cls += ' selected';
                }
                html += `
                    <div class="${cls}" data-optindex="${i}" data-qindex="${index}">
                        <span class="letter">${letters[i]}</span>
                        <span>${opt}</span>
                    </div>
                `;
            });
            elements.optionsGrid.innerHTML = html;

            const isAnswered2 = userAnswers[index] !== null && userAnswers[index] !== undefined;
            if (isAnswered2) {
                const isCorrect2 = userAnswers[index] === q.correct;
                elements.explanationBox.innerHTML = `
                    <strong>${isCorrect2 ? '✅ Correct' : '❌ Incorrect'}</strong><br>
                    ${q.explanation}
                `;
                elements.explanationBox.classList.add('show');
                elements.submitBtn.classList.remove('show');
                const isLast3 = index === totalQ - 1;
                if (isLast3) {
                    elements.nextInlineBtn.textContent = '📊 See Results';
                } else {
                    elements.nextInlineBtn.textContent = 'Next →';
                }
                elements.nextInlineBtn.classList.add('show');
            } else {
                elements.explanationBox.classList.remove('show');
                elements.nextInlineBtn.classList.remove('show');
                const tempSelected = document.querySelector('.option-item.selected');
                if (tempSelected) {
                    elements.submitBtn.disabled = false;
                } else {
                    elements.submitBtn.disabled = true;
                }
                elements.submitBtn.classList.add('show');
            }

            document.querySelectorAll('.option-item:not(.disabled)').forEach(el => {
                el.addEventListener('click', function() {
                    const qi = parseInt(this.dataset.qindex);
                    const optIdx = parseInt(this.dataset.optindex);
                    if (userAnswers[qi] !== null && userAnswers[qi] !== undefined) return;
                    selectOption(qi, optIdx);
                });
            });

            updateProgress();
            elements.prevBtn.disabled = index === 0;
            const isLast = index === totalQ - 1;
            const isAnswered3 = userAnswers[index] !== null && userAnswers[index] !== undefined;
            elements.nextBtn.textContent = isLast ? '📊 See Results' : 'Next →';
            elements.nextBtn.disabled = !isAnswered3;
            if (answeredCount === totalQ) {
                elements.nextBtn.disabled = false;
            }
            updateScore();
        }

        function selectOption(qIndex, optIndex) {
            if (userAnswers[qIndex] !== null && userAnswers[qIndex] !== undefined) return;
            document.querySelectorAll('.option-item').forEach(el => {
                el.classList.remove('selected');
            });
            const clicked = document.querySelector(.option-item[data-qindex=""][data-optindex=""]);
            if (clicked) clicked.classList.add('selected');
            elements.submitBtn.disabled = false;
        }

        function submitAnswer() {
            const q = QUESTIONS[currentIndex];
            if (!q) return;
            if (userAnswers[currentIndex] !== null && userAnswers[currentIndex] !== undefined) return;
            const selectedEl = document.querySelector('.option-item.selected');
            if (!selectedEl) return;
            const optIndex = parseInt(selectedEl.dataset.optindex);
            userAnswers[currentIndex] = optIndex;
            const isCorrect = optIndex === q.correct;
            questionStatus[currentIndex] = isCorrect ? 'correct' : 'incorrect';
            answeredCount = userAnswers.filter(a => a !== null && a !== undefined).length;
            renderQuestion(currentIndex);
            updateScore();
        }

        function handleNextInline() {
            if (currentIndex === totalQ - 1) {
                const allAnswered = userAnswers.every(a => a !== null && a !== undefined);
                if (allAnswered) {
                    showResults();
                } else {
                    const answered = userAnswers.filter(a => a !== null && a !== undefined).length;
                    if (answered === totalQ) {
                        showResults();
                    } else {
                        alert(You've answered  of  questions. Please answer all questions to see results.);
                    }
                }
                return;
            }
            if (currentIndex < totalQ - 1) {
                goToQuestion(currentIndex + 1);
            }
        }
        function goToQuestion(index) {
            if (index < 0 || index >= totalQ) return;
            currentIndex = index;
            renderQuestion(index);
            document.querySelector('.question-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function updateProgress() {
            const answered = userAnswers.filter(a => a !== null && a !== undefined).length;
            const pct = totalQ > 0 ? (answered / totalQ) * 100 : 0;
            elements.progressFill.style.width = `${pct}%`;
            elements.questionCounter.textContent = `${currentIndex + 1} / ${totalQ}`;
            const correctCount = questionStatus.filter(s => s === 'correct').length;
            const attempted = questionStatus.filter(s => s === 'correct' || s === 'incorrect').length;
            const acc = attempted > 0 ? Math.round((correctCount / attempted) * 100) : 0;
            elements.accuracyDisplay.textContent = attempted > 0 ? `🎯 ${acc}%` : '—';
        }

        function updateScore() {
            const correctCount = questionStatus.filter(s => s === 'correct').length;
            elements.scoreDisplay.innerHTML = `${correctCount} <span>/ ${totalQ}</span>`;
        }

        function showResults() {
            elements.questionArea.style.display = 'none';
            elements.navControls.style.display = 'none';
            elements.resultsContainer.classList.add('show');
            const correctCount = questionStatus.filter(s => s === 'correct').length;
            const incorrectCount = questionStatus.filter(s => s === 'incorrect').length;
            const skippedCount = totalQ - correctCount - incorrectCount;
            const pct = totalQ > 0 ? Math.round((correctCount / totalQ) * 100) : 0;
            elements.finalScore.textContent = `${pct}%`;
            let label = 'Keep practicing! 💪';
            if (pct >= 90) label = '🌟 Excellent! You\'re ready for the exam!';
            else if (pct >= 70) label = '👏 Good job! Review a few more topics.';
            else if (pct >= 50) label = '📚 Keep studying — you\'re on the right track!';
            elements.finalLabel.textContent = label;
            elements.statCorrect.textContent = correctCount;
            elements.statIncorrect.textContent = incorrectCount;
            elements.statSkipped.textContent = skippedCount;
            elements.progressFill.style.width = '100%';
            elements.questionCounter.textContent = `${totalQ} / ${totalQ}`;
            elements.accuracyDisplay.textContent = `🎯 ${pct}%`;
        }

        elements.prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) goToQuestion(currentIndex - 1);
        });

        elements.nextBtn.addEventListener('click', () => {
            if (currentIndex === totalQ - 1) {
                const allAnswered = userAnswers.every(a => a !== null && a !== undefined);
                if (allAnswered) {
                    showResults();
                } else {
                    const answered = userAnswers.filter(a => a !== null && a !== undefined).length;
                    if (answered === totalQ) {
                        showResults();
                    } else {
                        alert(`You've answered ${answered} of ${totalQ} questions. Please answer all questions to see results.`);
                    }
                }
                return;
            }
            if (currentIndex < totalQ - 1) {
                goToQuestion(currentIndex + 1);
            }
        });

        elements.submitBtn.addEventListener('click', submitAnswer);

        elements.nextInlineBtn.addEventListener('click', handleNextInline);

        elements.resetBtn.addEventListener('click', () => {
            userAnswers = new Array(totalQ).fill(null);
            questionStatus = new Array(totalQ).fill('unanswered');
            answeredCount = 0;
            currentIndex = 0;
            elements.resultsContainer.classList.remove('show');
            elements.questionArea.style.display = 'block';
            elements.navControls.style.display = 'flex';
            renderQuestion(0);
            updateProgress();
            updateScore();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && !elements.prevBtn.disabled) {
                elements.prevBtn.click();
            } else if (e.key === 'ArrowRight' && !elements.nextBtn.disabled) {
                elements.nextBtn.click();
            } else if (e.key === 'Enter') {
                const isAnswered = userAnswers[currentIndex] !== null && userAnswers[currentIndex] !== undefined;
                if (!isAnswered && !elements.submitBtn.disabled && elements.submitBtn.classList.contains('show')) {
                    elements.submitBtn.click();
                } else if (isAnswered && elements.nextInlineBtn.classList.contains('show')) {
                    elements.nextInlineBtn.click();
                }
            } else if (e.key === '1') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 0) opts[0].click();
            } else if (e.key === '2') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 1) opts[1].click();
            } else if (e.key === '3') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 2) opts[2].click();
            } else if (e.key === '4') {
                const opts = document.querySelectorAll('.option-item:not(.disabled)');
                if (opts.length > 3) opts[3].click();
            }
        });

        renderQuestion(0);
        updateProgress();
        updateScore();
    </script>
</body>
</html>
