<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f6f3"/>
      <stop offset="100%" stop-color="#f0ece6"/>
    </linearGradient>
    <linearGradient id="genGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#74b9ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#74b9ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e17055" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e17055" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="#2d1b69">Decision Boundary Comparison</text>
  <text x="400" y="58" text-anchor="middle" font-size="12" fill="#888">Generative (left) vs Discriminative (right) — same data, different boundaries</text>

  <!-- ─── LEFT PANEL: Generative ─── -->
  <rect x="30" y="72" width="355" height="410" rx="10" fill="#fff" filter="url(#shadow)"/>
  <rect x="30" y="72" width="355" height="38" rx="10" fill="#00b894" opacity="0.85"/>
  <rect x="30" y="96" width="355" height="14" fill="#00b894" opacity="0.85"/>
  <text x="207" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">🎯 Generative Model (Gaussian NB)</text>

  <!-- Data points left -->
  <!-- Class A (blue) -->
  <circle cx="110" cy="290" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="140" cy="360" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="95" cy="340" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="130" cy="320" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="80" cy="310" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="160" cy="280" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="120" cy="260" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="100" cy="240" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="170" cy="310" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="145" cy="240" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>

  <!-- Class B (pink) -->
  <circle cx="280" cy="190" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="300" cy="160" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="260" cy="140" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="320" cy="200" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="290" cy="120" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="240" cy="170" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="310" cy="230" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="250" cy="210" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="270" cy="250" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="330" cy="140" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>

  <!-- Elliptical generative boundary -->
  <ellipse cx="195" cy="245" rx="110" ry="95" fill="none" stroke="#00b894" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.9"/>
  <!-- Filled region inside -->
  <ellipse cx="195" cy="245" rx="110" ry="95" fill="url(#genGrad)" stroke="none"/>

  <!-- Class distribution ellipses (dotted) -->
  <ellipse cx="125" cy="305" rx="35" ry="45" fill="none" stroke="#74b9ff" stroke-width="1.5" stroke-dasharray="3,5" opacity="0.5"/>
  <ellipse cx="285" cy="185" rx="40" ry="42" fill="none" stroke="#fd79a8" stroke-width="1.5" stroke-dasharray="3,5" opacity="0.5"/>

  <!-- Class means -->
  <circle cx="125" cy="305" r="4" fill="#74b9ff"/>
  <circle cx="285" cy="185" r="4" fill="#fd79a8"/>

  <!-- Labels -->
  <text x="125" y="370" text-anchor="middle" font-size="11" fill="#74b9ff" font-weight="600">Class A</text>
  <text x="285" y="145" text-anchor="middle" font-size="11" fill="#fd79a8" font-weight="600">Class B</text>

  <!-- Annotation: learns P(X|Y) -->
  <text x="207" y="440" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Learns P(X|Y) — models each class's distribution</text>
  <text x="207" y="458" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Boundary emerges from Bayes' rule</text>

  <!-- ─── RIGHT PANEL: Discriminative ─── -->
  <rect x="415" y="72" width="355" height="410" rx="10" fill="#fff" filter="url(#shadow)"/>
  <rect x="415" y="72" width="355" height="38" rx="10" fill="#e17055" opacity="0.85"/>
  <rect x="415" y="96" width="355" height="14" fill="#e17055" opacity="0.85"/>
  <text x="592" y="97" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">🎯 Discriminative Model (Logistic Regression)</text>

  <!-- Data points right (same configuration, slightly shifted) -->
  <circle cx="495" cy="290" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="525" cy="360" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="480" cy="340" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="515" cy="320" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="465" cy="310" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="545" cy="280" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="505" cy="260" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="485" cy="240" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="555" cy="310" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>
  <circle cx="530" cy="240" r="5" fill="#74b9ff" stroke="#fff" stroke-width="1.5"/>

  <circle cx="665" cy="190" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="685" cy="160" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="645" cy="140" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="705" cy="200" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="675" cy="120" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="625" cy="170" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="695" cy="230" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="635" cy="210" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="655" cy="250" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>
  <circle cx="715" cy="140" r="5" fill="#fd79a8" stroke="#fff" stroke-width="1.5"/>

  <!-- Linear discriminative boundary -->
  <line x1="430" y1="390" x2="740" y2="100" stroke="#e17055" stroke-width="2.5" stroke-dasharray="6,4"/>
  <!-- Filled regions -->
  <polygon points="430,390 740,100 740,72 430,72" fill="url(#discGrad)"/>

  <!-- Labels -->
  <text x="510" y="370" text-anchor="middle" font-size="11" fill="#74b9ff" font-weight="600">Class A</text>
  <text x="670" y="145" text-anchor="middle" font-size="11" fill="#fd79a8" font-weight="600">Class B</text>

  <!-- Annotation -->
  <text x="592" y="440" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Learns P(Y|X) — draws a direct decision boundary</text>
  <text x="592" y="458" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Does not model the underlying data distribution</text>

  <!-- Footer note -->
  <text x="400" y="490" text-anchor="middle" font-size="10" fill="#aaa">Both models trained on the same dataset — notice how the boundary shape differs</text>
</svg>
